<!DOCTYPE html>  
<html lang="en">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>KaziNow | Messages</title>  
    <script src="https://cdn.tailwindcss.com"></script>  
    <script src="https://unpkg.com/lucide@latest"></script>  
    <style>  
        /* Custom scrollbar to match mobile feel */  
        .custom-scrollbar::-webkit-scrollbar {  
            width: 4px;  
        }  
        .custom-scrollbar::-webkit-scrollbar-track {  
            background: transparent;  
        }  
        .custom-scrollbar::-webkit-scrollbar-thumb {  
            background: rgba(255, 255, 255, 0.2);  
            border-radius: 4px;  
        }  
    </style>  
</head>  
<body class="bg-slate-900 flex justify-center items-center min-h-screen p-0 sm:p-4 font-sans antialiased selection:bg-slate-700 selection:text-white">  

    <!-- Mobile Device Container -->  
    <div class="w-full max-w-md h-[100vh] sm:h-[92vh] sm:rounded-[36px] overflow-hidden flex flex-col relative shadow-2xl bg-cover bg-center border border-slate-700/50"   
         style="background-image: linear-gradient(to bottom, rgba(15, 23, 42, 0.6), rgba(15, 23, 42, 0.7)), url('https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=1000&auto=format&fit=crop');">  
        
        <!-- Header / App Bar (Matching the Top Bar in Image) -->  
        <div class="bg-slate-900/80 backdrop-blur-md text-white p-4 flex items-center justify-between z-10 border-b border-slate-800/50">  
            <div class="flex items-center gap-3">  
                <button class="text-slate-300 hover:text-white transition">  
                    <i data-lucide="arrow-left" class="w-6 h-6"></i>  
                </button>  
                <div class="w-10 h-10 rounded-full bg-amber-400 flex items-center justify-center text-slate-900 font-bold text-lg shadow-inner">  
                    <i data-lucide="user" class="w-6 h-6 text-amber-950"></i>  
                </div>  
                <span class="font-semibold text-lg tracking-wide text-slate-100">MPESA</span>  
            </div>  
            <button class="text-slate-300 hover:text-white">  
                <i data-lucide="more-vertical" class="w-5 h-5"></i>  
            </button>  
        </div>  

        <!-- Messages Area (Scrollable SMS Body) -->  
        <div id="jobsContainer" class="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar">  
            <!-- Loading Skeleton -->  
            <div class="flex flex-col items-start animate-pulse">  
                <div class="bg-slate-200/90 rounded-2xl p-4 w-3/4 h-20 shadow-md"></div>  
            </div>  
        </div>  

        <!-- Bottom Banner / Non-replyable Footer (Matching Pic Exactly) -->  
        <div class="p-4 bg-slate-100/90 backdrop-blur-md rounded-t-3xl sm:rounded-b-[36px] text-slate-700 text-xs text-left border-t border-slate-200/50">  
            Sender can't accept replies. <a href="#" class="underline font-medium text-slate-800">Contact them directly.</a> <a href="#" class="underline font-medium text-slate-800">Learn more</a>  
            <!-- Navigation pill indicator -->  
            <div class="w-32 h-1 bg-slate-400 rounded-full mx-auto mt-3"></div>  
        </div>  

    </div>  

    <script>  
        const API = "https://message-server-five.vercel.app";  
        const TARGET_PHONE = "1";  
        let allJobs = [];  

        // Extracting or formatting time if available  
        function formatTime(tx) {  
            if (tx.createdAt) {  
                const date = new Date(tx.createdAt);  
                return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });  
            }  
            return "19:17"; // Fallback time matching UI design  
        }  

        function renderJob(tx) {  
            const messageText = tx.message || '';  
            const timeStr = formatTime(tx);  

            return `  
                <div class="flex flex-col items-start space-y-1 mb-3">  
                    <!-- SMS Message Bubble (White pill style with left rounded corner) -->  
                    <div class="bg-[rgb(240,240,245)] text-slate-900 text-[14px] leading-relaxed p-4 rounded-3xl rounded-tl-sm max-w-[88%] shadow-md whitespace-pre-wrap break-words font-sans selection:bg-slate-300">  
                        ${escapeHtml(messageText)}  
                    </div>  
                    <!-- Timestamp beneath bubble -->  
                    <span class="text-[11px] text-slate-300 px-2 font-medium tracking-wide">  
                        ${timeStr} • Safaricom  
                    </span>  
                </div>  
            `;  
        }  

        function escapeHtml(text) {  
            return text  
                .replace(/&/g, "&amp;")  
                .replace(/</g, "&lt;")  
                .replace(/>/g, "&gt;")  
                .replace(/"/g, "&quot;")  
                .replace(/'/g, "&#039;");  
        }  

        async function fetchJobs() {  
            try {  
                const res = await fetch(`${API}/api/messages/${TARGET_PHONE}`);  
                const data = await res.json();  
                  
                if (data.success && data.messages?.length > 0) {  
                    return data.messages;  
                }  
                  
                // Fallback  
                const txRes = await fetch(`${API}/transactions`);  
                const txData = await txRes.json();  
                return txData.filter(tx => tx.phone === TARGET_PHONE);  
            } catch (err) {  
                console.error('Failed to fetch jobs:', err);  
                return [];  
            }  
        }  

        function displayJobs(jobs) {  
            const container = document.getElementById('jobsContainer');  

            if (jobs.length === 0) {  
                container.innerHTML = `  
                    <div class="text-center py-10 text-slate-300 text-sm">  
                        No messages found.  
                    </div>  
                `;  
                return;  
            }  

            // Render messages in natural order (Oldest top, Newest bottom like real SMS)  
            container.innerHTML = jobs.map(tx => renderJob(tx)).join('');  

            // Auto-scroll to bottom of conversation (standard SMS app behavior)  
            container.scrollTop = container.scrollHeight;  
        }  

        async function loadJobs() {  
            allJobs = await fetchJobs();  
            displayJobs(allJobs);  
        }  

        // Initialize Lucide icons & load messages  
        lucide.createIcons();  
        loadJobs();  
    </script>  
</body>  
</html>
