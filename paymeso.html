
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Messages</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      color: #111;
      height: 100vh;
      overflow: hidden;
    }

    /* PHONE NUMBER SCREEN */
    #loginScreen {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      background: #f7f7f7;
    }

    .login-box {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border-radius: 18px;
      padding: 30px 24px;
      box-shadow: 0 5px 25px rgba(0,0,0,.08);
    }

    .login-box h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .login-box p {
      color: #777;
      font-size: 15px;
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .phone-input {
      width: 100%;
      height: 54px;
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 0 16px;
      font-size: 17px;
      outline: none;
    }

    .phone-input:focus {
      border-color: #555;
    }

    .load-btn {
      width: 100%;
      height: 54px;
      margin-top: 14px;
      border: none;
      border-radius: 12px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .load-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .error {
      color: #d00;
      font-size: 14px;
      margin-top: 12px;
      display: none;
    }

    /* MESSAGE SCREEN */
    #messageScreen {
      display: none;
      height: 100vh;
      flex-direction: column;
      background: #fff;
    }

    .top-bar {
      height: 65px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 0 16px;
      border-bottom: 1px solid #eee;
      background: #fff;
      z-index: 5;
    }

    .back-btn {
      width: 40px;
      height: 40px;
      border: none;
      background: transparent;
      font-size: 28px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .account-info {
      min-width: 0;
      flex: 1;
    }

    .account-name {
      font-size: 17px;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .account-number {
      color: #777;
      font-size: 13px;
      margin-top: 2px;
    }

    .refresh-btn {
      border: none;
      background: transparent;
      font-size: 22px;
      cursor: pointer;
    }

    /* SCROLLABLE MESSAGE AREA */
    #messages {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 15px 12px 30px;
      background: #f5f5f5;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar {
      width: 5px;
    }

    #messages::-webkit-scrollbar-thumb {
      background: #bbb;
      border-radius: 10px;
    }

    .date-divider {
      text-align: center;
      margin: 13px 0;
    }

    .date-divider span {
      background: #ddd;
      color: #555;
      font-size: 11px;
      padding: 5px 10px;
      border-radius: 12px;
    }

    .message-row {
      display: flex;
      margin: 7px 0;
      width: 100%;
    }

    .message-row.received {
      justify-content: flex-start;
    }

    .message-row.sent {
      justify-content: flex-end;
    }

    .message {
      max-width: 82%;
      padding: 10px 13px 7px;
      border-radius: 17px;
      font-size: 15px;
      line-height: 1.4;
      word-wrap: break-word;
      overflow-wrap: anywhere;
    }

    .received .message {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-bottom-left-radius: 5px;
    }

    .sent .message {
      background: #d9fdd3;
      border-bottom-right-radius: 5px;
    }

    .message-text {
      white-space: pre-wrap;
    }

    .message-time {
      display: block;
      text-align: right;
      color: #777;
      font-size: 10px;
      margin-top: 4px;
    }

    .loading {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #777;
      font-size: 15px;
    }

    .empty {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #777;
      text-align: center;
      padding: 30px;
    }

    .empty-icon {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .empty p {
      font-size: 15px;
    }

    @media (min-width: 700px) {
      #messages {
        padding-left: calc((100% - 650px) / 2);
        padding-right: calc((100% - 650px) / 2);
      }

      .message {
        max-width: 70%;
      }
    }
  </style>
</head>

<body>

  <!-- PHONE NUMBER SCREEN -->
  <section id="loginScreen">

    <div class="login-box">

      <h1>Messages</h1>

      <p>
        Enter the phone number associated with the account
        whose messages you want to view.
      </p>

      <input
        id="phoneNumber"
        class="phone-input"
        type="tel"
        inputmode="tel"
        autocomplete="tel"
        placeholder="Enter phone number"
      >

      <button id="loadButton" class="load-btn">
        Load Messages
      </button>

      <div id="errorMessage" class="error"></div>

    </div>

  </section>


  <!-- MESSAGE SCREEN -->
  <section id="messageScreen">

    <header class="top-bar">

      <button class="back-btn" onclick="goBack()">
        ‹
      </button>

      <div class="account-info">
        <div class="account-name" id="accountName">
          Messages
        </div>

        <div class="account-number" id="accountNumber">
          —
        </div>
      </div>

      <button
        class="refresh-btn"
        onclick="loadMessages()"
        title="Refresh"
      >
        ↻
      </button>

    </header>


    <main id="messages">

      <div class="loading">
        Loading messages...
      </div>

    </main>

  </section>


<script>

  /*
   * =========================================================
   * BACKEND CONFIGURATION
   * =========================================================
   *
   * CHANGE THIS TO YOUR REAL BACKEND URL.
   *
   * Example:
   *
   * const API_URL = "https://your-backend.onrender.com/api/messages";
   *
   */

  const API_URL = "https://YOUR-BACKEND-URL.com/api/messages";


  const loginScreen = document.getElementById("loginScreen");
  const messageScreen = document.getElementById("messageScreen");

  const phoneInput = document.getElementById("phoneNumber");
  const loadButton = document.getElementById("loadButton");

  const messagesContainer = document.getElementById("messages");

  const accountName = document.getElementById("accountName");
  const accountNumber = document.getElementById("accountNumber");

  const errorMessage = document.getElementById("errorMessage");


  let currentPhone = "";


  /*
   * LOAD BUTTON
   */

  loadButton.addEventListener("click", function () {

    const phone = phoneInput.value.trim();

    if (!phone) {
      showError("Please enter a phone number.");
      return;
    }

    hideError();

    currentPhone = phone;

    loadMessages();

  });


  /*
   * ALLOW ENTER KEY
   */

  phoneInput.addEventListener("keydown", function (event) {

    if (event.key === "Enter") {
      loadButton.click();
    }

  });


  /*
   * LOAD MESSAGES FROM BACKEND
   */

  async function loadMessages() {

    if (!currentPhone) {
      currentPhone = phoneInput.value.trim();
    }

    if (!currentPhone) {
      return;
    }


    messageScreen.style.display = "flex";
    loginScreen.style.display = "none";


    accountName.textContent = "Messages";
    accountNumber.textContent = currentPhone;


    messagesContainer.innerHTML = `
      <div class="loading">
        Loading messages...
      </div>
    `;


    try {

      /*
       * The phone number is sent to the backend as:
       *
       * GET /api/messages?phone=0712345678
       */

      const response = await fetch(
        API_URL +
        "?phone=" +
        encodeURIComponent(currentPhone)
      );


      if (!response.ok) {

        throw new Error(
          "Server returned " + response.status
        );

      }


      const data = await response.json();


      /*
       * Supports either:
       *
       * [
       *   {...},
       *   {...}
       * ]
       *
       * OR:
       *
       * {
       *   messages: [...]
       * }
       */

      let messages = [];

      if (Array.isArray(data)) {
        messages = data;
      }

      else if (Array.isArray(data.messages)) {
        messages = data.messages;
      }

      else if (Array.isArray(data.data)) {
        messages = data.data;
      }


      displayMessages(messages);


    }

    catch (error) {

      console.error(error);

      messagesContainer.innerHTML = `
        <div class="empty">

          <div class="empty-icon">⚠️</div>

          <p>
            Unable to load messages.
          </p>

          <p style="margin-top:8px;font-size:13px;">
            Check your backend URL and connection.
          </p>

        </div>
      `;

    }

  }


  /*
   * DISPLAY MESSAGES
   */

  function displayMessages(messages) {

    messagesContainer.innerHTML = "";


    if (!messages || messages.length === 0) {

      messagesContainer.innerHTML = `
        <div class="empty">

          <div class="empty-icon">💬</div>

          <p>
            No messages found for this account.
          </p>

        </div>
      `;

      return;
    }


    /*
     * Sort messages oldest → newest
     */

    messages.sort(function (a, b) {

      const dateA = new Date(
        a.created_at ||
        a.createdAt ||
        a.timestamp ||
        a.date ||
        0
      );

      const dateB = new Date(
        b.created_at ||
        b.createdAt ||
        b.timestamp ||
        b.date ||
        0
      );

      return dateA - dateB;

    });


    let lastDate = "";


    messages.forEach(function (msg) {

      /*
       * Accept different common backend field names.
       */

      const text =
        msg.message ??
        msg.text ??
        msg.body ??
        msg.content ??
        "";


      const direction =
        String(
          msg.direction ??
          msg.type ??
          msg.status ??
          "received"
        ).toLowerCase();


      const isSent =
        direction === "sent" ||
        direction === "outgoing" ||
        direction === "send" ||
        direction === "out";


      const dateValue =
        msg.created_at ||
        msg.createdAt ||
        msg.timestamp ||
        msg.date ||
        "";


      const dateObject =
        dateValue
          ? new Date(dateValue)
          : null;


      /*
       * Date divider
       */

      if (
        dateObject &&
        !isNaN(dateObject.getTime())
      ) {

        const dateString =
          dateObject.toLocaleDateString(
            undefined,
            {
              day: "numeric",
              month: "short",
              year: "numeric"
            }
          );


        if (dateString !== lastDate) {

          const divider =
            document.createElement("div");

          divider.className =
            "date-divider";


          const span =
            document.createElement("span");

          span.textContent =
            dateString;


          divider.appendChild(span);

          messagesContainer.appendChild(divider);


          lastDate = dateString;

        }

      }


      /*
       * Message row
       */

      const row =
        document.createElement("div");

      row.className =
        "message-row " +
        (isSent ? "sent" : "received");


      const bubble =
        document.createElement("div");

      bubble.className =
        "message";


      /*
       * Message text
       */

      const messageText =
        document.createElement("div");

      messageText.className =
        "message-text";

      messageText.textContent =
        text;


      bubble.appendChild(messageText);


      /*
       * Time
       */

      if (
        dateObject &&
        !isNaN(dateObject.getTime())
      ) {

        const time =
          document.createElement("span");

        time.className =
          "message-time";


        time.textContent =
          dateObject.toLocaleTimeString(
            undefined,
            {
              hour: "numeric",
              minute: "2-digit"
            }
          );


        bubble.appendChild(time);

      }


      row.appendChild(bubble);

      messagesContainer.appendChild(row);

    }


    /*
     * Start at newest message
     */

    requestAnimationFrame(function () {

      messagesContainer.scrollTop =
        messagesContainer.scrollHeight;

    });

  }


  /*
   * GO BACK TO PHONE NUMBER
   */

  function goBack() {

    messageScreen.style.display = "none";
    loginScreen.style.display = "flex";

    messagesContainer.innerHTML = "";

  }


  /*
   * ERROR HANDLING
   */

  function showError(message) {

    errorMessage.textContent =
      message;

    errorMessage.style.display =
      "block";

  }


  function hideError() {

    errorMessage.style.display =
      "none";

  }

</script>

</body>
</html>
