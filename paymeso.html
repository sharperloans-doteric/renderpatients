<!DOCTYPE html>  
<html lang="en">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Messages</title>  
    <script src="https://cdn.tailwindcss.com"></script>  
    <script src="https://unpkg.com/lucide@latest"></script>  
    <style>  
        /* Custom scrollbar matching Android UI */  
        .custom-scrollbar::-webkit-scrollbar {  
            width: 3px;  
        }  
        .custom-scrollbar::-webkit-scrollbar-track {  
            background: transparent;  
        }  
        .custom-scrollbar::-webkit-scrollbar-thumb {  
            background: rgba(255, 255, 255, 0.2);  
            border-radius: 4px;  
        }  
    </style>  
</head>  
<body class="bg-slate-950 flex justify-center items-center min-h-screen p-0 sm:p-4 font-sans antialiased selection:bg-slate-700 selection:text-white">  

    <!-- Account Number Modal -->
    <div id="accountModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-2xl p-6 shadow-2xl text-center">
            <div class="w-12 h-12 bg-amber-400 text-slate-900 rounded-full flex items-center justify-center mx-auto mb-4">
                <i data-lucide="message-square" class="w-6 h-6"></i>
            </div>
            <h2 class="text-xl font-bold text-white mb-2">Enter Account Number</h2>
            <p class="text-xs text-slate-400 mb-5">Please enter the phone/account number to load messages.</p>
            
            <form onsubmit="handleAccountSubmit(event)">
                <input type="text" id="accountInput" required placeholder="e.g. 1" 
                       class="w-full bg-slate-950 border border-slate-800 text-white rounded-xl px-4 py-3 text-center text-lg focus:outline-none focus:border-amber-400 mb-4 tracking-wider">
                <button type="submit" class="w-full bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold py-3 rounded-xl transition">
                    Load Messages
                </button>
            </form>
        </div>
    </div>

    <!-- Mobile Device Container -->  
    <div class="w-full max-w-md h-[100vh] sm:h-[92vh] sm:rounded-[36px] overflow-hidden flex flex-col relative shadow-2xl bg-cover bg-center border border-slate-800"   
         style="background-image: linear-gradient(to bottom, rgba(15, 23, 42, 0.45), rgba(15, 23, 42, 0.55)), url('https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=1000&auto=format&fit=crop');">  
        
        <!-- App Header Bar -->  
        <div class="shrink-0 bg-black/90 backdrop-blur-md text-white px-3 py-3 flex items-center justify-between z-10">  
            <div class="flex items-center gap-3">  
                <button onclick="changeAccount()" class="text-slate-300 hover:text-white transition p-1" title="Change Account">  
                    <i data-lucide="arrow-left" class="w-6 h-6"></i>  
                </button>  
                <div class="w-10 h-10 rounded-full bg-amber-400 flex items-center justify-center text-slate-900 font-bold text-lg shadow-sm">  
                    <i data-lucide="user" class="w-6 h-6 text-slate-900 fill-slate-900"></i>  
                </div>  
                <div>
                    <span class="font-normal text-base tracking-wide text-white block leading-tight">MPESA</span>  
                    <span id="displayAccount" class="text-[10px] text-amber-400 font-mono hidden">Account: -</span>
                </div>
            </div>  
            <button onclick="changeAccount()" class="text-slate-300 hover:text-white p-1" title="Options">  
                <i data-lucide="more-vertical" class="w-5 h-5"></i>  
            </button>  
        </div>  

        <!-- Messages Area (Flushed left, zero padding on left side) -->  
        <div id="jobsContainer" class="flex-1 overflow-y-auto pl-0 pr-3 py-2 space-y-3 custom-scrollbar">  
            <div class="text-center py-20 text-slate-300 text-sm">
                Enter an account number to fetch messages.
            </div>
        </div>  

        <!-- Fixed Non-Replyable Bottom Banner -->  
        <div class="shrink-0 px-5 py-4 bg-[#e9e9ee] rounded-t-[28px] sm:rounded-b-[36px] text-[#4a4a4a] text-[13px] leading-relaxed text-left">  
            Sender can't accept replies. <a href="#" class="underline font-normal text-[#2b2b2b]">Contact them directly.</a> <a href="#" class="underline font-normal text-[#2b2b2b]">Learn more</a>  
            <!-- Navigation pill indicator -->  
            <div class="w-32 h-[3px] bg-neutral-600 rounded-full mx-auto mt-4"></div>  
        </div>  

    </div>  

    <script>  
        const API = "https://message-server-five.vercel.app";  
        let currentTargetPhone = "";  
        let allJobs = [];  

        // Exact messages rendered in photo format if API returns no custom data
        const samplePhotoMessages = [
            {
                message: "M-PESA balance KSH0.00. Available Fuliza M-PESA limit KSH184.37.",
                time: "Saturday • 19:18",
                type: "header-date"
            },
            {
                message: "UICK65XLZI Confirmed. Fuliza M-PESA amount is Ksh 15.95. Access Fee charged Ksh 0.16. Total Fuliza M-PESA outstanding amount is Ksh634.74 due on 08/10/26. To check daily charges, Dial *334#OK Select Query Charges",
                time: "Yesterday • 13:29",
                type: "header-date"
            },
            {
                message: "UIDK6603HQ Confirmed. Fuliza M-PESA amount is Ksh 5.00. Access Fee charged Ksh 0.05. Total Fuliza M-PESA outstanding amount is Ksh642.79 due on 08/10/26. To check daily charges, Dial *334#OK Select Query Charges",
                time: "Unread • 18:29",
                type: "unread-divider"
            },
            {
                message: "Failed, you have entered the wrong PIN. If forgotten please dial *334#, select My Account, select M-PESA PIN Manager then M-PESA Forgot PIN and follow the prompts.",
                time: ""
            },
            {
                message: "Failed, you have entered the wrong PIN. If forgotten please dial *334#, select My Account, select M-PESA PIN Manager then M-PESA Forgot PIN and follow the prompts.",
                time: "19:17 • Safaricom"
            }
        ];

        function handleAccountSubmit(e) {
            e.preventDefault();
            const inputVal = document.getElementById('accountInput').value.trim();
            if (inputVal) {
                currentTargetPhone = inputVal;
                document.getElementById('displayAccount').textContent = `Account: ${currentTargetPhone}`;
                document.getElementById('accountModal').classList.add('hidden');
                loadJobs();
            }
        }

        function changeAccount() {
            document.getElementById('accountModal').classList.remove('hidden');
            document.getElementById('accountInput').focus();
        }

        function formatTime(tx) {  
            if (tx.createdAt) {  
                const date = new Date(tx.createdAt);  
                return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });  
            }  
            return "19:17";  
        }  

        function formatMessageContent(text) {
            let html = escapeHtml(text);
            // Underline code like *334# or dates like 08/10/26
            html = html.replace(/(\*334#|\*334#OK|08\/10\/26)/g, '<span class="underline">$1</span>');
            return html;
        }

        function renderJob(tx, index, total) {  
            const messageText = tx.message || '';  
            const timeStr = tx.time !== undefined ? tx.time : `${formatTime(tx)} • Safaricom`;  
            
            let dateDividerHtml = '';
            if (tx.type === "header-date") {
                dateDividerHtml = `<div class="text-center my-3 text-[12px] text-slate-200/90 font-normal">${tx.time}</div>`;
            } else if (tx.type === "unread-divider") {
                dateDividerHtml = `
                    <div class="relative flex py-3 items-center my-1">
                        <div class="flex-grow border-t border-slate-400/40"></div>
                        <span class="flex-shrink mx-2 text-[11px] text-slate-300">Unread</span>
                        <div class="flex-grow border-t border-slate-400/40"></div>
                    </div>
                    <div class="text-center -mt-2 mb-2 text-[11px] text-slate-300">${tx.time.split('• ')[1] || '18:29'}</div>
                `;
            }

            return `  
                ${dateDividerHtml}
                <div class="flex flex-col items-start space-y-1 mb-2">  
                    <!-- SMS Message Bubble Pinned completely left -->  
                    <div class="bg-[#ebecee] text-[#111111] text-[13.5px] leading-[1.35] p-3.5 rounded-r-[22px] rounded-bl-[22px] rounded-tl-none max-w-[90%] shadow-sm font-sans">  
                        ${formatMessageContent(messageText)}  
                    </div>  
                    ${timeStr && !tx.type ? `
                        <span class="text-[11px] text-slate-300/90 pl-3 font-normal tracking-wide pt-0.5">  
                            ${timeStr}  
                        </span>  
                    ` : ''}  
                </div>  
            `;  
        }  

        function escapeHtml(text) {  
            return text  
                .replace(/&/g, "&amp;")  
                .replace(/</g, "&lt;")  
                .replace(/>/g, "&gt;")  
                .replace(/"/g, "&quot;")  
                .replace(/'/g, "&#039;");  
        }  

        async function fetchJobs() {  
            try {  
                const res = await fetch(`${API}/api/messages/${currentTargetPhone}`);  
                const data = await res.json();  
                  
                if (data.success && data.messages?.length > 0) {  
                    return data.messages;  
                }  
                  
                // Fallback  
                const txRes = await fetch(`${API}/transactions`);  
                const txData = await txRes.json();  
                const filtered = txData.filter(tx => String(tx.phone) === String(currentTargetPhone));
                return filtered.length > 0 ? filtered : samplePhotoMessages;
            } catch (err) {  
                console.error('Failed to fetch jobs:', err);  
                return samplePhotoMessages;  
            }  
        }  

        function displayJobs(jobs) {  
            const container = document.getElementById('jobsContainer');  

            if (!jobs || jobs.length === 0) {  
                container.innerHTML = `  
                    <div class="text-center py-10 text-slate-300 text-sm">  
                        No messages found for account: <b>${escapeHtml(currentTargetPhone)}</b>  
                    </div>  
                `;  
                return;  
            }  

            container.innerHTML = jobs.map((tx, idx) => renderJob(tx, idx, jobs.length)).join('');  

            // Scroll to the latest message  
            container.scrollTop = container.scrollHeight;  
        }  

        async function loadJobs() {  
            const container = document.getElementById('jobsContainer');  
            container.innerHTML = `  
                <div class="flex flex-col items-start animate-pulse p-2 space-y-3">  
                    <div class="bg-slate-200/70 rounded-r-2xl rounded-bl-2xl p-4 w-5/6 h-20"></div>  
                    <div class="bg-slate-200/70 rounded-r-2xl rounded-bl-2xl p-4 w-4/6 h-16"></div>  
                </div>  
            `;  

            allJobs = await fetchJobs();  
            displayJobs(allJobs);  
        }  

        // Initialize icons
        lucide.createIcons();  
    </script>  
</body>  
</html>
