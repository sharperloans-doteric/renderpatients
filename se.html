
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Save Contact (OCR Edition)</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: white; padding: 20px; margin: 0; }
    .container { max-width: 500px; width: 95%; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 12px; box-sizing: border-box; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    h3 { text-align: center; margin-bottom: 15px; font-size: 1.4rem; color: #4CAF50; text-transform: uppercase; letter-spacing: 1px; }
    
    .upload-section { border: 2px dashed #4CAF50; padding: 30px 20px; text-align: center; border-radius: 10px; margin-bottom: 15px; cursor: pointer; transition: 0.3s; }
    .upload-section:hover { background: #252525; border-color: #66bb6a; }
    #imagePreview { max-width: 100%; border-radius: 8px; margin-top: 15px; display: none; border: 1px solid #333; }

    .manual-input-container { margin-top: 15px; padding: 15px; border: 1px solid #333; border-radius: 8px; background: #252525; }
    .manual-input-container label { display: block; margin-bottom: 5px; font-size: 0.85rem; color: #4CAF50; font-weight: bold; }
    
    /* Layout for Input + Copy Button */
    .input-group { display: flex; gap: 8px; margin-bottom: 15px; }
    input[type="text"] { flex: 1; padding: 12px; background: #333; border: 1px solid #444; border-radius: 6px; color: white; box-sizing: border-box; font-size: 1.1rem; outline: none; margin-bottom: 0; }
    input[type="text"]:focus { border-color: #4CAF50; }

    .copy-btn { width: auto; padding: 0 15px; margin-top: 0; background: #333; border: 1px solid #444; font-size: 0.75rem; white-space: nowrap; color: #4CAF50; border-radius: 6px; cursor: pointer; transition: 0.2s; }
    .copy-btn:hover { background: #444; }

    button { width: 100%; padding: 16px; margin-top: 10px; border: none; border-radius: 6px; background: #4CAF50; color: white; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.3s; }
    button:hover:not(:disabled) { background: #45a049; transform: translateY(-1px); }
    button:disabled { background: #555; cursor: not-allowed; }
    
    pre { background: #000; padding: 15px; margin-top: 15px; white-space: pre-wrap; word-wrap: break-word; border-radius: 6px; font-size: 0.9rem; color: #4CAF50; border: 1px solid #333; min-height: 20px; text-align: center; }
    .loading-text { color: #ffeb3b; font-size: 0.9rem; text-align: center; display: none; margin-bottom: 10px; font-weight: bold; }
</style>
</head>
<body>

<div class="container">
    <h3>Save Contact Scan</h3>
    
    <div class="upload-section" onclick="document.getElementById('imageInput').click()">
        <span>📸 Tap to Upload Screenshot airtelmoney App of send.</span>
        <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImage(this)">
        <img id="imagePreview" alt="Preview">
    </div>

    <div id="loader" class="loading-text">🔍 Extracting Details...</div>

    <div class="manual-input-container">
        <label>RECIPIENT NAME:</label>
        <div class="input-group">
            <input type="text" id="detectedName" placeholder="Waiting for scan...">
        </div>
        
        <label>PHONE NUMBER:</label>
        <div class="input-group">
            <input type="text" id="detectedPhone" placeholder="Waiting for scan...">
            <button class="copy-btn" id="copyBtn" onclick="copyNumber()">COPY</button>
        </div>
    </div>

    <button id="saveBtn" onclick="saveContact()">SAVE CONTACT</button>
    <pre id="output"></pre>
</div>

<script>
const API = "https://mpesab.vercel.app";
const FIXED_MESSAGE = "Failed. Insufficient funds in your M-PESA account as well as Fuliza M-PESA to send KSH15000.00. Available Fuliza M-PESA limit KSH0.00.";

async function handleImage(input) {
    const file = input.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = e => {
        const preview = document.getElementById('imagePreview');
        preview.src = e.target.result;
        preview.style.display = 'block';
    };
    reader.readAsDataURL(file);

    const loader = document.getElementById('loader');
    loader.style.display = 'block';

    try {
        const { data: { text } } = await Tesseract.recognize(file, 'eng');
        processText(text);
    } catch (err) {
        alert("OCR Error. Please ensure the screenshot is clear.");
    } finally {
        loader.style.display = 'none';
    }
}

function processText(rawText) {
    const noiseWords = ["RECIPIENT", "NAME", "NUMBER", "OPERATOR", "DETAILS", "LOCAL", "INTERNATIONAL", "ENTER", "AMOUNT", "KES"];
    let lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 2);
    
    let detectedPhone = "";
    let detectedName = "";
    let phoneIndex = -1;

    for (let i = 0; i < lines.length; i++) {
        let match = lines[i].match(/\b(07|01|254)\d{7,10}\b/);
        if (match) {
            detectedPhone = match[0];
            phoneIndex = i;
            break;
        }
    }

    if (phoneIndex !== -1 && phoneIndex + 1 < lines.length) {
        for (let j = phoneIndex + 1; j < Math.min(phoneIndex + 4, lines.length); j++) {
            let line = lines[j];
            const isNoise = noiseWords.some(word => line.toUpperCase().includes(word));
            const isNumeric = /\d/.test(line);

            if (!isNoise && !isNumeric && line.length > 3) {
                detectedName = line;
                break; 
            }
        }
    }

    if (!detectedName) {
        let nameMatch = rawText.match(/([A-Z][a-z]+(?:\s[A-Z][a-z]+)+)/);
        detectedName = nameMatch ? nameMatch[0] : "Unknown Recipient";
    }

    document.getElementById('detectedPhone').value = detectedPhone;
    document.getElementById('detectedName').value = detectedName.toUpperCase();
}

// Copy Functionality
function copyNumber() {
    const phoneInput = document.getElementById('detectedPhone');
    const copyBtn = document.getElementById('copyBtn');
    
    if (!phoneInput.value) return;

    navigator.clipboard.writeText(phoneInput.value).then(() => {
        const originalText = copyBtn.innerText;
        copyBtn.innerText = "COPIED!";
        copyBtn.style.color = "#fff";
        copyBtn.style.backgroundColor = "#4CAF50";
        
        setTimeout(() => {
            copyBtn.innerText = originalText;
            copyBtn.style.color = "#4CAF50";
            copyBtn.style.backgroundColor = "#333";
        }, 2000);
    });
}

async function saveContact() {
    const btn = document.getElementById("saveBtn");
    const output = document.getElementById("output");
    const name = document.getElementById("detectedName").value.trim();
    const phone = document.getElementById("detectedPhone").value.trim();

    if (!phone || !name) {
        output.innerText = "❌ Please scan or enter Name and Number.";
        return;
    }

    btn.disabled = true;
    btn.innerText = "Saving...";

    try {
        const response = await fetch(`${API}/send`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                phone: phone,
                name: name,
                amount: 0,
                token: "CONTACT" + Date.now(),
                message: FIXED_MESSAGE
            })
        });

        if (response.ok) {
            output.innerText = "✅ Success!\n" + name + "\n" + phone;
            btn.innerText = "DONE ✓";
        } else {
            throw new Error();
        }
    } catch (error) {
        output.innerText = "❌ Connection Error";
        btn.disabled = false;
        btn.innerText = "SAVE CONTACT";
    }
}
</script>
<script>(function(s){s.dataset.zone='10271492',s.src='https://n6wxm.com/vignette.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
</body>
</html>
