<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
  background: #000;
  color: #fff;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Header Styles */
.messages-header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  background: #201f1f;
  border-bottom: 1px solid #333;
  padding: 10px 15px;
  z-index: 100;
  display: flex;
  align-items: center;
  gap: 10px;
  height: 50px;
}
.logo { height: 28px; }
.header-title {
  font-size: 1.3rem;
  font-weight: 600;
  color: #af5656;
}
.back-btn {
  font-size: 24px;
  cursor: pointer;
  padding: 5px 10px;
  user-select: none;
}
.more-menu {
  position: absolute;
  right: 0.3cm;
  font-size: 22px;
  cursor: pointer;
  color: #fff;
  user-select: none;
  -webkit-touch-callout: none;
  padding: 5px;
}

/* Page Content */
.page-content {
  margin-top: 50px;
  flex: 1;
  max-width: 500px;
  width: 100%;
  margin-left: auto;
  margin-right: auto;
  background: #1a1919;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Tab Navigation */
.tab-container {
  display: flex;
  background: #201f1f;
  border-bottom: 1px solid #333;
  overflow-x: auto;
  scrollbar-width: none;
}
.tab-container::-webkit-scrollbar { display: none; }
.tab {
  flex: 1;
  padding: 12px 8px;
  text-align: center;
  font-size: 13px;
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
  white-space: nowrap;
}
.tab.active {
  border-bottom-color: #25d366;
  color: #25d366;
}
.tab .count {
  display: inline-block;
  background: #25d366;
  color: #000;
  font-size: 10px;
  padding: 1px 5px;
  border-radius: 10px;
  margin-left: 4px;
  font-weight: 600;
}

/* Inbox List */
.inbox-container {
  flex: 1;
  overflow-y: auto;
  background: #000;
}
.inbox-item {
  display: flex;
  align-items: center;
  padding: 12px 15px;
  border-bottom: 1px solid #222;
  cursor: pointer;
  transition: background 0.2s;
}
.inbox-item:active {
  background: #1a1919;
}
.inbox-item.unread {
  background: #1a1a2e;
}
.inbox-avatar {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  background: #333;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  margin-right: 12px;
  flex-shrink: 0;
}
.inbox-avatar.mpesa { background: #00A859; }
.inbox-avatar.promo { background: #e65100; }
.inbox-avatar.social { background: #1976d2; }
.inbox-avatar.personal { background: #7b1fa2; }
.inbox-avatar.bank { background: #1565c0; }
.inbox-info {
  flex: 1;
  min-width: 0;
}
.inbox-sender {
  font-weight: 600;
  font-size: 15px;
  margin-bottom: 3px;
}
.inbox-preview {
  font-size: 13px;
  color: #888;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.inbox-meta {
  text-align: right;
  flex-shrink: 0;
  margin-left: 10px;
}
.inbox-time {
  font-size: 11px;
  color: #666;
  margin-bottom: 4px;
}
.unread-dot {
  width: 10px;
  height: 10px;
  background: #25d366;
  border-radius: 50%;
  margin-left: auto;
}

/* Conversation View */
.conversation-header {
  display: flex;
  align-items: center;
  padding: 10px 15px;
  background: #201f1f;
  border-bottom: 1px solid #333;
}
.conversation-sender {
  font-weight: 600;
  font-size: 16px;
}
.conversation-subject {
  font-size: 12px;
  color: #888;
}
.messages-container {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
  display: flex;
  flex-direction: column;
  background: #000;
  scroll-behavior: auto;
}

/* Message Bubbles */
.message-bubble {
  max-width: 85%;
  padding: 12px 16px;
  border-radius: 18px;
  font-size: 15px;
  margin-bottom: 10px;
  width: fit-content;
  animation: slideInUp 0.3s ease both;
}
.message-bubble.received {
  background: #333;
  border: 1px solid #444;
  margin-right: auto;
  border-bottom-left-radius: 4px;
}
.message-bubble.sent {
  background: #25d366;
  color: #000;
  margin-left: auto;
  border-bottom-right-radius: 4px;
}
.message-bubble.hide {
  opacity: 0;
  transform: scale(0.9);
}
.message-time {
  font-size: 11px;
  opacity: 0.7;
  margin-top: 4px;
  text-align: right;
}
.message-date {
  text-align: center;
  font-size: 12px;
  color: #666;
  margin: 15px 0;
  padding: 5px;
}

/* Reply Box */
.reply-container {
  display: flex;
  padding: 10px;
  background: #201f1f;
  border-top: 1px solid #333;
  align-items: center;
  gap: 10px;
}
.reply-container.hidden {
  display: none;
}
.reply-input {
  flex: 1;
  padding: 12px 15px;
  border: 1px solid #444;
  border-radius: 25px;
  background: #000;
  color: #fff;
  font-size: 15px;
  resize: none;
  max-height: 100px;
}
.reply-input:focus {
  outline: none;
  border-color: #25d366;
}
.send-btn {
  width: 45px;
  height: 45px;
  border-radius: 50%;
  background: #25d366;
  border: none;
  cursor: pointer;
  font-size: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.send-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* Login Styles */
#loginContainer {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  min-height: calc(100vh - 50px);
  padding: 30px;
  background: #000;
}
#loginContainer.hidden {
  display: none;
}
.phone-input {
  width: 100%;
  max-width: 350px;
  padding: 12px 15px;
  border: 1px solid #444;
  border-radius: 8px;
  background: #000;
  color: #fff;
  font-size: 16px;
  margin-bottom: 15px;
}
.phone-input:focus {
  outline: none;
  border-color: #25d366;
}
.load-btn {
  width: 100%;
  max-width: 350px;
  padding: 12px 20px;
  background: #25d366;
  color: #000;
  border: none;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
}
.register-btn {
  padding: 12px 20px;
  background: transparent;
  color: #25d366;
  border: 2px solid #25d366;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
  margin-top: 15px;
}

/* Category Badge */
.category-badge {
  display: inline-block;
  font-size: 9px;
  padding: 2px 6px;
  border-radius: 4px;
  margin-bottom: 4px;
  font-weight: 600;
}
.category-badge.mpesa { background: #00A859; color: #fff; }
.category-badge.promo { background: #e65100; color: #fff; }
.category-badge.social { background: #1976d2; color: #fff; }
.category-badge.personal { background: #7b1fa2; color: #fff; }
.category-badge.bank { background: #1565c0; color: #fff; }

/* Empty State */
.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #666;
  padding: 40px;
  text-align: center;
}
.empty-state .icon {
  font-size: 60px;
  margin-bottom: 20px;
}

/* No Reply Info */
.no-reply-info {
  background: #1a1919;
  color: #aaa;
  font-size: 13px;
  padding: 15px;
  text-align: center;
  border-top: 1px solid #333;
  user-select: none;
}

/* Offline Message */
.offline-message {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  color: #ff6b6b;
  text-align: center;
  padding: 20px;
}

/* Install Button */
.install-btn {
  position: fixed;
  bottom: 90px;
  right: 16px;
  background: #25d366;
  color: #000;
  padding: 14px 18px;
  border-radius: 30px;
  font-weight: 600;
  font-size: 14px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.4);
  cursor: pointer;
  display: none;
  z-index: 999;
}

/* Loading Spinner */
.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px;
}
.spinner {
  width: 40px;
  height: 40px;
  border: 3px solid #333;
  border-top-color: #25d366;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes slideInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 480px) {
  .messages-header { padding: 8px 10px; height: 45px; }
  .page-content { margin-top: 45px; }
}
</style>
</head>
<body>
<div class="messages-header">
  <span class="back-btn" id="backBtn" style="display:none;">←</span>
  <img src="logo.png" class="logo" id="headerLogo">
  <h1 class="header-title" id="headerTitle">Messages</h1>
  <div class="more-menu" id="moreBtn">⋮</div>
</div>
<div class="page-content">
  <!-- Login Section -->
  <div class="phone-input-container" id="loginContainer">
    <h2 style="margin-bottom:30px;font-size:28px;color:#25d366;">Messages</h2>
    <input type="tel" class="phone-input" id="loginPhone" placeholder="Phone number (2547...)">
    <input type="password" class="phone-input" id="loginPassword" placeholder="Password">
    <button class="load-btn" id="loginBtn">Login</button>
    <button class="register-btn" onclick="window.location.href='ksen.html'">Request Account</button>
  </div>
  
  <!-- Tab Navigation -->
  <div class="tab-container" id="tabContainer" style="display:none;">
    <div class="tab active" data-tab="all">All<span class="count" id="countAll">0</span></div>
    <div class="tab" data-tab="mpesa">M-PESA<span class="count" id="countMpesa">0</span></div>
    <div class="tab" data-tab="personal">Personal<span class="count" id="countPersonal">0</span></div>
    <div class="tab" data-tab="social">Social<span class="count" id="countSocial">0</span></div>
    <div class="tab" data-tab="promo">Promotions<span class="count" id="countPromo">0</span></div>
    <div class="tab" data-tab="bank">Banks<span class="count" id="countBank">0</span></div>
  </div>
  
  <!-- Inbox List -->
  <div class="inbox-container" id="inboxList">
    <div class="empty-state" id="emptyInbox">
      <div class="icon">📱</div>
      <div>No messages yet</div>
      <div style="font-size:13px;margin-top:10px;">Your messages will appear here</div>
    </div>
  </div>
  
  <!-- Conversation View -->
  <div id="conversationView" style="display:none;flex-direction:column;flex:1;overflow:hidden;">
    <div class="conversation-header" id="conversationHeader">
      <div class="inbox-avatar" id="convAvatar">📱</div>
      <div>
        <div class="conversation-sender" id="convSender">Unknown</div>
        <div class="conversation-subject" id="convSubject"></div>
      </div>
    </div>
    <div class="messages-container" id="messages"></div>
    <div class="reply-container hidden" id="replyContainer">
      <textarea class="reply-input" id="replyInput" placeholder="Type a message..." rows="1"></textarea>
      <button class="send-btn" id="sendBtn">➤</button>
    </div>
    <div class="no-reply-info" id="noReplyBar">
      Cannot reply to this short code number
    </div>
  </div>
</div>
<div class="install-btn" id="installBtn">
  <span>⬇️</span> Install App
</div>

<script>
// ─── CONFIGURATION ───
const API = "https://message-server-five.vercel.app";
const SYSTEM_API = "https://funds-mauve.vercel.app/api";
const MLEDER_ID = "mleder";
const urlRegex = /(https?:\/\/[^\s]+)|(www\.[^\s]+)/gi;

// ─── STATE MANAGEMENT ───
let isLoggedIn = false;
let loggedInPhone = null;
let allMessages = [];
let filteredMessages = [];
let currentTab = 'all';
let currentConversation = null;
let conversationMessages = [];

// ─── LOCAL STORAGE KEYS ───
const SAVED_PHONE_KEY = 'mledger_view_phone';
const SAVED_AUTH_KEY = 'mledger_view_auth';

// ─── HELPERS ───
function extractFirstUrl(text) {
  const match = text.match(urlRegex);
  if (!match) return null;
  let url = match[0].trim();
  if (url.startsWith('www.')) url = 'https://' + url;
  url = url.replace(/[.,!?;)\]}>]+$/g, '');
  return url;
}

function isMpesaRelatedLink(url) {
  if (!url) return false;
  const lower = url.toLowerCase();
  return lower.includes('mpesa') || lower.includes('safaricom');
}

function getFaviconUrl(url) {
  if (!url) return null;
  try {
    const domain = new URL(url).origin;
    return `https://www.google.com/s2/favicons?domain=${encodeURIComponent(domain)}&sz=64`;
  } catch { return null; }
}

function renderMessageContent(text) {
  let safe = text.replace(/&/g, '&').replace(/</g, '<').replace(/>/g, '>');
  return safe.replace(urlRegex, (match) => {
    let full = match.startsWith('www.') ? 'https://' + match : match;
    return `<a href="${full}" target="_blank" rel="noopener noreferrer" style="color:#60a5fa;text-decoration:underline;">${match}</a>`;
  });
}

function extractTimeFromMessage(message) {
  const match = message.match(/at (\d{1,2}:\d{2} (?:AM|PM))/i);
  return match ? match[1] : new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}

function formatTime(date) {
  return date.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
}

function formatDate(date) {
  const today = new Date();
  const yesterday = new Date(today);
  yesterday.setDate(yesterday.getDate() - 1);
  
  if (date.toDateString() === today.toDateString()) return 'Today';
  if (date.toDateString() === yesterday.toDateString()) return 'Yesterday';
  return date.toLocaleDateString([], {month: 'short', day: 'numeric'});
}

// ─── MESSAGE CATEGORIZATION ───
function categorizeMessage(message, sender) {
  const lowerMsg = message.toLowerCase();
  const senderLower = (sender || '').toLowerCase();
  
  // M-PESA Detection
  if (lowerMsg.includes('mpesa') || 
      lowerMsg.includes('safaricom') || 
      lowerMsg.includes('b2c') || 
      lowerMsg.includes('b2b') ||
      lowerMsg.includes('kcb') && lowerMsg.includes('mpesa') ||
      senderLower === 'mpesa' ||
      sender === 'SAFARICOM' ||
      sender === ' SAFARICOM' ||
      /^\d{4}$/.test(sender)) {
    return 'mpesa';
  }
  
  // Bank Detection
  if (lowerMsg.includes('bank') || 
      lowerMsg.includes('equity') || 
      lowerMsg.includes('kcb') || 
      lowerMsg.includes('co-op') ||
      lowerMsg.includes('dtb') ||
      lowerMsg.includes('stanchart') ||
      lowerMsg.includes(' Barclays') ||
      lowerMsg.includes(' CBA')) {
    return 'bank';
  }
  
  // Social Detection
  if (senderLower.includes('whatsapp') || 
      senderLower.includes('telegram') ||
      senderLower.includes('facebook') ||
      senderLower.includes('instagram') ||
      senderLower.includes('twitter') ||
      senderLower.includes('tiktok')) {
    return 'social';
  }
  
  // Promotions Detection
  if (lowerMsg.includes('win') || 
      lowerMsg.includes('promo') ||
      lowerMsg.includes('offer') ||
      lowerMsg.includes('discount') ||
      lowerMsg.includes('deal') ||
      lowerMsg.includes('cashback') ||
      lowerMsg.includes('bonus') ||
      lowerMsg.includes('free')) {
    return 'promo';
  }
  
  // Personal Detection (short codes that can receive replies)
  if (/^\d{3,4}$/.test(sender)) {
    return 'personal';
  }
  
  return 'personal'; // Default for regular numbers
}

function getCategoryIcon(category) {
  switch(category) {
    case 'mpesa': return '💚';
    case 'bank': return '🏦';
    case 'social': return '💬';
    case 'promo': return '🎁';
    default: return '👤';
  }
}

function getCategoryColor(category) {
  switch(category) {
    case 'mpesa': return '#00A859';
    case 'bank': return '#1565c0';
    case 'social': return '#1976d2';
    case 'promo': return '#e65100';
    default: return '#7b1fa2';
  }
}

function canReplyToCategory(category, sender) {
  // M-PESA short codes cannot be replied to
  if (category === 'mpesa' && /^\d{3,4}$/.test(sender)) return false;
  // Banks cannot be replied
  if (category === 'bank') return false;
  return true;
}

// ─── MESSAGE GROUPING ───
function groupMessagesBySender(messages) {
  const groups = {};
  
  messages.forEach(msg => {
    const sender = msg.sender || msg.from || 'Unknown';
    const key = sender.toLowerCase();
    
    if (!groups[key]) {
      groups[key] = {
        sender: sender,
        category: categorizeMessage(msg.message || msg.text, sender),
        messages: [],
        lastTime: null,
        unread: false
      };
    }
    
    groups[key].messages.push(msg);
    
    // Update last time
    const msgTime = msg.timestamp || msg.time || msg.created_at;
    if (msgTime && (!groups[key].lastTime || new Date(msgTime) > new Date(groups[key].lastTime))) {
      groups[key].lastTime = msgTime;
    }
    
    // Check unread
    if (msg.unread) groups[key].unread = true;
  });
  
  // Sort by last time, newest first
  return Object.values(groups).sort((a, b) => {
    const timeA = a.lastTime ? new Date(a.lastTime) : new Date(0);
    const timeB = b.lastTime ? new Date(b.lastTime) : new Date(0);
    return timeB - timeA;
  });
}

// ─── AUTO-LOGIN ───
function getSavedCredentials() {
  const phone = localStorage.getItem(SAVED_PHONE_KEY);
  const auth = localStorage.getItem(SAVED_AUTH_KEY);
  return { phone, auth };
}

function saveCredentials(phone, auth) {
  localStorage.setItem(SAVED_PHONE_KEY, phone);
  localStorage.setItem(SAVED_AUTH_KEY, auth);
}

function clearCredentials() {
  localStorage.removeItem(SAVED_PHONE_KEY);
  localStorage.removeItem(SAVED_AUTH_KEY);
}

async function tryAutoLogin() {
  const savedUser = localStorage.getItem('mledger_user');
  if (savedUser) {
    try {
      const user = JSON.parse(savedUser);
      if (user && user.phone) {
        isLoggedIn = true;
        loggedInPhone = user.phone;
        saveCredentials(user.phone, 'logged_in');
        showMainView();
        loadAllMessages(user.phone);
        return true;
      }
    } catch (e) {}
  }
  document.querySelector('.messages-header').style.display = 'none';
  return false;
}

// ─── LOGIN HANDLERS ───
const loginContainer = document.getElementById('loginContainer');
const loginBtn = document.getElementById('loginBtn');
const loginPhone = document.getElementById('loginPhone');
const loginPassword = document.getElementById('loginPassword');

loginBtn.addEventListener('click', async () => {
  const phone = loginPhone.value.trim();
  const password = loginPassword.value.trim();
  
  if (!phone || !password) {
    alert('Please enter both phone number and password');
    return;
  }
  
  loginBtn.innerText = 'Logging in...';
  loginBtn.disabled = true;
  
  try {
    const res = await fetch(`${SYSTEM_API}/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone, password })
    });
    
    const data = await res.json();
    
    if (res.ok && data.success) {
      localStorage.setItem('mledger_user', JSON.stringify(data.user));
      isLoggedIn = true;
      loggedInPhone = phone;
      saveCredentials(phone, password);
      showMainView();
      loadAllMessages(phone);
    } else {
      alert(data.error || 'Invalid phone number or password');
    }
  } catch (err) {
    alert('Login failed. Please try again.');
    console.error('Login error:', err);
  }
  
  loginBtn.innerText = 'Login';
  loginBtn.disabled = false;
});

loginPassword.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') loginBtn.click();
});

loginPhone.addEventListener('keypress', (e) => {
  if (e.key === 'Enter') loginPassword.focus();
});

// ─── VIEW MANAGEMENT ───
function showMainView() {
  loginContainer.classList.add('hidden');
  document.querySelector('.messages-header').style.display = 'flex';
  document.getElementById('tabContainer').style.display = 'flex';
  document.getElementById('inboxList').style.display = 'flex';
  document.getElementById('conversationView').style.display = 'none';
  document.getElementById('backBtn').style.display = 'none';
  document.getElementById('headerTitle').textContent = 'Messages';
}

function showConversation(sender, category) {
  document.getElementById('inboxList').style.display = 'none';
  document.getElementById('conversationView').style.display = 'flex';
  document.getElementById('backBtn').style.display = 'block';
  document.getElementById('headerTitle').textContent = sender;
  
  currentConversation = { sender, category };
  
  // Update conversation header
  const avatar = document.getElementById('convAvatar');
  avatar.textContent = getCategoryIcon(category);
  avatar.className = `inbox-avatar ${category}`;
  document.getElementById('convSender').textContent = sender;
  
  // Show/hide reply based on category
  const replyContainer = document.getElementById('replyContainer');
  const noReplyBar = document.getElementById('noReplyBar');
  
  if (canReplyToCategory(category, sender)) {
    replyContainer.classList.remove('hidden');
    noReplyBar.style.display = 'none';
  } else {
    replyContainer.classList.add('hidden');
    noReplyBar.style.display = 'block';
  }
  
  // Filter messages for this sender
  conversationMessages = allMessages.filter(msg => {
    const msgSender = msg.sender || msg.from || 'Unknown';
    return msgSender.toLowerCase() === sender.toLowerCase();
  });
  
  renderConversation();
}

// ─── BACK BUTTON ───
document.getElementById('backBtn').addEventListener('click', () => {
  showMainView();
  currentConversation = null;
  renderInbox();
});

// ─── TAB NAVIGATION ───
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentTab = tab.dataset.tab;
    renderInbox();
  });
});

// ─── RENDER INBOX ───
function renderInbox() {
  const container = document.getElementById('inboxList');
  const emptyInbox = document.getElementById('emptyInbox');
  
  // Filter by category
  if (currentTab === 'all') {
    filteredMessages = allMessages;
  } else {
    filteredMessages = allMessages.filter(msg => {
      const sender = msg.sender || msg.from || 'Unknown';
      const category = categorizeMessage(msg.message || msg.text, sender);
      return category === currentTab;
    });
  }
  
  // Group by sender
  const groups = groupMessagesBySender(filteredMessages);
  
  // Update counts
  updateTabCounts();
  
  if (groups.length === 0) {
    container.innerHTML = '';
    container.appendChild(emptyInbox);
    emptyInbox.style.display = 'flex';
    return;
  }
  
  emptyInbox.style.display = 'none';
  container.innerHTML = groups.map(group => {
    const lastMsg = group.messages[group.messages.length - 1];
    const preview = (lastMsg.message || lastMsg.text || '').substring(0, 50);
    const time = group.lastTime ? formatDate(new Date(group.lastTime)) : '';
    
    return `
      <div class="inbox-item ${group.unread ? 'unread' : ''}" data-sender="${group.sender}" data-category="${group.category}">
        <div class="inbox-avatar ${group.category}">${getCategoryIcon(group.category)}</div>
        <div class="inbox-info">
          <div style="display:flex;align-items:center;gap:6px;">
            <span class="inbox-sender">${group.sender}</span>
            <span class="category-badge ${group.category}">${group.category.toUpperCase()}</span>
          </div>
          <div class="inbox-preview">${preview}...</div>
        </div>
        <div class="inbox-meta">
          <div class="inbox-time">${time}</div>
          ${group.unread ? '<div class="unread-dot"></div>' : ''}
        </div>
      </div>
    `;
  }).join('');
  
  // Add click handlers
  container.querySelectorAll('.inbox-item').forEach(item => {
    item.addEventListener('click', () => {
      const sender = item.dataset.sender;
      const category = item.dataset.category;
      showConversation(sender, category);
    });
  });
}

function updateTabCounts() {
  const counts = {
    all: allMessages.length,
    mpesa: 0,
    personal: 0,
    social: 0,
    promo: 0,
    bank: 0
  };
  
  allMessages.forEach(msg => {
    const sender = msg.sender || msg.from || 'Unknown';
    const category = categorizeMessage(msg.message || msg.text, sender);
    if (counts[category] !== undefined) {
      counts[category]++;
    }
  });
  
  document.getElementById('countAll').textContent = counts.all;
  document.getElementById('countMpesa').textContent = counts.mpesa;
  document.getElementById('countPersonal').textContent = counts.personal;
  document.getElementById('countSocial').textContent = counts.social;
  document.getElementById('countPromo').textContent = counts.promo;
  document.getElementById('countBank').textContent = counts.bank;
}

// ─── RENDER CONVERSATION ───
function renderConversation() {
  const container = document.getElementById('messages');
  container.innerHTML = '';
  
  if (conversationMessages.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="icon">💬</div><div>No messages in this conversation</div></div>';
    return;
  }
  
  // Sort by timestamp
  const sorted = [...conversationMessages].sort((a, b) => {
    const timeA = new Date(a.timestamp || a.time || a.created_at || 0);
    const timeB = new Date(b.timestamp || b.time || b.created_at || 0);
    return timeA - timeB;
  });
  
  let lastDate = null;
  
  sorted.forEach(msg => {
    const msgDate = formatDate(new Date(msg.timestamp || msg.time || msg.created_at || Date.now()));
    
    // Date separator
    if (msgDate !== lastDate) {
      const dateDiv = document.createElement('div');
      dateDiv.className = 'message-date';
      dateDiv.textContent = msgDate;
      container.appendChild(dateDiv);
      lastDate = msgDate;
    }
    
    const bubble = document.createElement('div');
    bubble.className = 'message-bubble received';
    
    const msgText = msg.message || msg.text || '';
    const msgTime = formatTime(new Date(msg.timestamp || msg.time || msg.created_at || Date.now()));
    
    // Render with links
    let content = msgText.replace(/&/g, '&').replace(/</g, '<').replace(/>/g, '>');
    content = content.replace(urlRegex, (match) => {
      let full = match.startsWith('www.') ? 'https://' + match : match;
      return `<a href="${full}" target="_blank" rel="noopener noreferrer" style="color:#60a5fa;text-decoration:underline;">${match}</a>`;
    });
    
    bubble.innerHTML = `
      <div style="word-break:break-word;">${content}</div>
      <div class="message-time">${msgTime}</div>
    `;
    
    container.appendChild(bubble);
  });
  
  // Scroll to bottom
  setTimeout(() => {
    container.scrollTop = container.scrollHeight;
  }, 100);
}

// ─── REPLY FUNCTIONALITY ───
const replyInput = document.getElementById('replyInput');
const sendBtn = document.getElementById('sendBtn');

sendBtn.addEventListener('click', async () => {
  const text = replyInput.value.trim();
  if (!text || !currentConversation) return;
  
  sendBtn.disabled = true;
  sendBtn.innerText = '⏳';
  
  try {
    // Simulate sending (in real app, this would call an API)
    const newMsg = {
      id: Date.now(),
      sender: loggedInPhone,
      to: currentConversation.sender,
      message: text,
      timestamp: new Date().toISOString(),
      type: 'sent',
      status: 'delivered'
    };
    
    // Add to messages
    allMessages.push(newMsg);
    conversationMessages.push(newMsg);
    
    // Clear input
    replyInput.value = '';
    
    // Re-render
    renderConversation();
    renderInbox();
    
    // Simulate delivery confirmation
    setTimeout(() => {
      const lastBubble = document.querySelector('.message-bubble:last-child');
      if (lastBubble) {
        const timeEl = lastBubble.querySelector('.message-time');
        if (timeEl) timeEl.textContent += ' ✓✓';
      }
    }, 1000);
    
  } catch (err) {
    alert('Failed to send message. Please try again.');
    console.error('Send error:', err);
  }
  
  sendBtn.disabled = false;
  sendBtn.innerText = '➤';
});

replyInput.addEventListener('keypress', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendBtn.click();
  }
});

// Auto-resize textarea
replyInput.addEventListener('input', () => {
  replyInput.style.height = 'auto';
  replyInput.style.height = Math.min(replyInput.scrollHeight, 100) + 'px';
});

// ─── LOAD MESSAGES ───
async function loadAllMessages(phone) {
  const inboxList = document.getElementById('inboxList');
  inboxList.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  
  try {
    // Load from message server
    const res = await fetch(`${API}/api/messages/${phone}`);
    const data = await res.json();
    
    if (data.success && data.messages) {
      allMessages = data.messages.map(msg => ({
        ...msg,
        id: msg.id || msg._id,
        sender: msg.from || msg.sender || phone,
        message: msg.text || msg.message,
        timestamp: msg.timestamp || msg.created_at
      }));
      
      // Cache for offline
      localStorage.setItem('cached_messages_' + phone, JSON.stringify(allMessages));
    } else {
      // Fallback to transactions
      const txRes = await fetch(`${API}/transactions`);
      if (txRes.ok) {
        const txData = await txRes.json();
        allMessages = txData.filter(tx => 
          tx.phone === phone || tx.phone.includes(phone.slice(-9))
        ).map(tx => ({
          ...tx,
          id: tx.id || tx._id,
          sender: 'SAFARICOM',
          message: tx.message,
          timestamp: tx.timestamp || tx.created_at
        }));
      }
    }
    
    renderInbox();
  } catch (err) {
    console.error('Error loading messages:', err);
    
    // Try cached
    const cached = localStorage.getItem('cached_messages_' + phone);
    if (cached) {
      allMessages = JSON.parse(cached);
      renderInbox();
      
      const notice = document.createElement('div');
      notice.style.cssText = 'padding:10px 14px;background:#422c00;color:#ffcc80;font-size:13px;text-align:center;';
      notice.textContent = 'Showing cached messages';
      inboxList.prepend(notice);
    } else {
      allMessages = [];
      renderInbox();
    }
  }
}

// ─── MORE BUTTON ───
const moreBtn = document.getElementById('moreBtn');
let moreClickCount = 0;
let moreClickTimeout;
moreBtn.addEventListener('click', () => {
  moreClickCount++;
  clearTimeout(moreClickTimeout);
  if (moreClickCount === 3) {
    if (loggedInPhone) loadAllMessages(loggedInPhone);
    moreClickCount = 0;
  } else {
    moreClickTimeout = setTimeout(() => { moreClickCount = 0; }, 400);
  }
});
moreBtn.addEventListener('contextmenu', (e) => e.preventDefault());

// ─── OFFLINE HANDLING ───
window.addEventListener('online', () => {
  if (loggedInPhone) loadAllMessages(loggedInPhone);
});
window.addEventListener('offline', () => {
  const cached = localStorage.getItem('cached_messages_' + loggedInPhone);
  if (cached) {
    allMessages = JSON.parse(cached);
    renderInbox();
  }
});

// ─── PWA INSTALL ───
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  setTimeout(() => {
    document.getElementById('installBtn').style.display = 'block';
  }, 5000);
});
document.getElementById('installBtn').addEventListener('click', async () => {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') {
      document.getElementById('installBtn').style.display = 'none';
    }
    deferredPrompt = null;
  }
});
