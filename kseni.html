<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>M-Ledger Login & Security</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        :root { --primary: #4CAF50; --dark: #0f0f0f; --card: #1a1a1a; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--dark); color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .box { width: 100%; max-width: 400px; background: var(--card); padding: 30px; border-radius: 20px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative; }
        input, select { width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; border: 1px solid #444; background: #000; color: var(--primary); box-sizing: border-box; font-size: 16px; }
        input:focus, select:focus { outline: none; border-color: var(--primary); }
        button { width: 100%; padding: 15px; border-radius: 10px; border: none; background: var(--primary); color: white; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.3s; margin-top: 10px; }
        button:disabled { background: #2e5d30; color: #888; cursor: not-allowed; }
        .link { text-align: center; margin-top: 15px; color: #888; cursor: pointer; text-decoration: underline; font-size: 14px; }
        h2 { text-align: center; margin-top: 0; color: var(--primary); }
        p.info { text-align: center; font-size: 13px; color: #aaa; margin-bottom: 20px; }
        #status { text-align: center; margin-top: 15px; font-weight: 500; min-height: 40px; font-size: 14px; }
       
        /* Biometric Prompt Styles */
        #biometricOverlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); z-index: 100; justify-content: center; align-items: center;
        }
        .bio-card { background: var(--card); padding: 30px; border-radius: 25px; text-align: center; width: 80%; max-width: 320px; border: 1px solid #333; }
        .bio-icon { font-size: 50px; color: var(--primary); margin-bottom: 20px; }
        #bioMsg { font-size: 14px; margin-top: 10px; min-height: 20px; }
       
        #quickBioBtn {
            background: none; border: 1px solid var(--primary); color: var(--primary);
            margin-top: 20px; display: none; align-items: center; justify-content: center; gap: 10px;
        }
        .loader { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s linear infinite; margin-right: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="biometricOverlay">
        <div class="bio-card">
            <div class="bio-icon">☝️</div>
            <h3>Enable M-ledger robot login!</h3>
            <p class="info">Would you like to login with M-ledger robot for faster logins next time?</p>
            <div id="bioMsg"></div>
            <button id="enrollBtn" onclick="enrollBiometrics()">Enable Now</button>
            <p class="link" onclick="closeBioOverlay()">Not Now</p>
        </div>
    </div>
    <div class="box">
        <div id="loginSection">
            <h2>M-Ledger Login</h2>
    
            <input id="lPhone" placeholder="Favourite Numbers" type="tel">
            <input id="lPass" type="password" placeholder="PIN/Password">
            <button id="lBtn" onclick="login()">Login</button>
           
            <button id="quickBioBtn" onclick="loginWithBiometrics()">
                <span>☝️</span> Login with M-ledger robot
            </button>
           
            <p id="disableBioLink" class="link" style="display:none; color: #ff5252; text-decoration: none; font-size: 12px;" onclick="disableBiometrics()">
                Disable M-ledger robot
            </p>
          
        </div>
        <div id="choiceSection" style="display:none">
            <h2>Karibu Tena!</h2>
           
            <button type="button" onclick="goTo('act.html')">Login</button>
           
            <button type="button" onclick="shareReferral()" style="background: #FF9800; margin-top: 10px;">
                📤 Refer & Earn
            </button>
           
            <p id="referralStatus" style="font-size: 12px; margin-top: 15px; line-height: 1.5; text-align: center; color: #aaa;"></p>
        </div>
       
        <div id="regSection" style="display:none">
            <h2>Create Account</h2>
            <input id="rName" placeholder="Favourite Name">
            <input id="rPhone" placeholder="Favourite Number" type="tel">
            <input id="rPass" type="password" placeholder="Set PIN/Password">
            <select id="referralChoice" onchange="toggleReferralInput()">
                <option value="no">No Referral</option>
                <option value="yes">Has been Referred</option>
            </select>
            <input id="rReferrer" placeholder="Referrer's Phone Number" type="tel" style="display:none;">
            <button id="rBtn" onclick="register()">Register</button>
            <p class="link" onclick="showSection('loginSection')">Back to Login</p>
        </div>
        <div id="resetSection" style="display:none">
            <h2>Reset PIN</h2>
            <p class="info">A <strong>Ksh 10.00</strong> verification fee is required.</p>
            <input id="resetPhone" placeholder="Registered Phone Number" type="tel">
            <input id="resetPass" type="password" placeholder="Enter New PIN">
            <button id="resetBtn" onclick="changePin()">Verify & Update PIN</button>
            <p class="link" onclick="showSection('loginSection')">Back to Login</p>
        </div>
        <p id="status"></p>
    </div>
    <script>
        const API = "https://funds-6jwd.vercel.app/api";
        const BACKEND_PAYMENT = "https://newpayment-byr6.vercel.app";
        const WEB3FORMS_KEY = "bf0e28a0-7666-4bfc-91ad-bcb1699d5d6c";
        window.onload = () => {
            checkBioStatus();
            handleReferralParam();
        };
        function encodeRef(data) {
            try {
                return btoa(encodeURIComponent(data)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
            } catch (e) { return ''; }
        }
        function decodeRef(data) {
            try {
                let base64 = data.replace(/-/g, '+').replace(/_/g, '/');
                while (base64.length % 4) base64 += '=';
                return decodeURIComponent(atob(base64));
            } catch (e) { return ''; }
        }
        function handleReferralParam() {
            const params = new URLSearchParams(window.location.search);
            const ref = params.get('ref');
            if (ref) {
                const decoded = decodeRef(ref);
                if (decoded) {
                    localStorage.setItem('referred_by', decoded);
                    showSection('regSection');
                    document.getElementById('referralChoice').style.display = 'none';
                    document.getElementById('rReferrer').style.display = 'none';
                }
            }
            const referredBy = localStorage.getItem('referred_by');
            if (referredBy && !ref) {
                const refInput = document.getElementById('rReferrer');
                const refChoice = document.getElementById('referralChoice');
                if (refChoice && refInput) {
                    refChoice.value = 'yes';
                    refInput.value = referredBy;
                    refInput.style.display = 'block';
                }
            }
        }
        function shareReferral() {
            const user = JSON.parse(localStorage.getItem('mledger_user') || '{}');
            const phone = user.phone || user.phone_number || user.msisdn || '';
            const statusEl = document.getElementById('referralStatus');
            if (!phone) {
                statusEl.innerText = "Please login first to get your referral link.";
                statusEl.style.color = "#ff5252";
                return;
            }
            try {
                const encoded = encodeRef(phone);
                const link = `https://zunzun.vercel.app/ksen.html?ref=${encoded}`;
                navigator.clipboard.writeText(link).then(() => {
                    statusEl.innerText = "Referral link copied! Share it with friends.";
                    statusEl.style.color = "#4CAF50";
                    if (navigator.share) {
                        navigator.share({
                            title: 'M-Ledger Referral',
                            text: 'Join M-Ledger using my referral link!',
                            url: link
                        }).catch(() => {});
                    }
                }).catch(() => {
                    statusEl.innerText = "Your referral link: " + link;
                    statusEl.style.color = "#4CAF50";
                });
            } catch (e) {
                statusEl.innerText = "Error generating referral link.";
                statusEl.style.color = "#ff5252";
            }
        }
        function checkBioStatus() {
            const isEnabled = localStorage.getItem('biometrics_enabled') === 'true';
            document.getElementById('quickBioBtn').style.display = isEnabled ? 'flex' : 'none';
            document.getElementById('disableBioLink').style.display = isEnabled ? 'block' : 'none';
        }
        function disableBiometrics() {
            if(confirm("Are you sure you want to disable robotic login?")) {
                localStorage.removeItem('biometrics_enabled');
                checkBioStatus();
                document.getElementById('status').style.color = "#ffab00";
                document.getElementById('status').innerText = "Robotic disabled.";
                setTimeout(() => { document.getElementById('status').innerText = ""; }, 2000);
            }
        }
        function closeBioOverlay() {
            document.getElementById('biometricOverlay').style.display = 'none';
            document.getElementById('bioMsg').innerText = "";
            showSection('choiceSection');
        }
        async function enrollBiometrics() {
            const bioMsg = document.getElementById('bioMsg');
            try {
                if (window.PublicKeyCredential) {
                    localStorage.setItem('biometrics_enabled', 'true');
                    bioMsg.style.color = "#4CAF50";
                    bioMsg.innerText = "Robot enabled successfully!";
                    checkBioStatus();
                    setTimeout(closeBioOverlay, 1500);
                } else {
                    bioMsg.style.color = "#ffab00";
                    bioMsg.innerText = "Device does not support robot login.";
                    setTimeout(closeBioOverlay, 2000);
                }
            } catch (e) {
                console.error(e);
                closeBioOverlay();
            }
        }
        async function loginWithBiometrics() {
            const status = document.getElementById('status');
            try {
                status.style.color = "#4CAF50";
                status.innerText = "Confirm robot on your device...";
               
                setTimeout(() => {
                    const user = JSON.parse(localStorage.getItem('mledger_user'));
                    if (user) {
                        showSection('choiceSection');
                        status.innerText = "";
                    } else {
                        status.style.color = "#ffab00";
                        status.innerText = "Please login with PIN once first.";
                    }
                }, 1500);
               
            } catch (err) {
                status.innerText = "Robot failed.";
            }
        }
        function showSection(sectionId) {
            ['loginSection', 'regSection', 'resetSection', 'choiceSection'].forEach(id => {
                document.getElementById(id).style.display = (id === sectionId) ? 'block' : 'none';
            });
            document.getElementById('status').innerText = "";
            if(sectionId === 'loginSection') checkBioStatus();
        }
        function toggleReferralInput() {
            const choice = document.getElementById('referralChoice').value;
            document.getElementById('rReferrer').style.display = (choice === 'yes') ? 'block' : 'none';
        }
        function goTo(page) { window.location.href = page; }
        async function login() {
            const btn = document.getElementById('lBtn');
            const status = document.getElementById('status');
            const phone = document.getElementById('lPhone').value;
            const pass = document.getElementById('lPass').value;
           
            if(!phone || !pass) { status.innerText = "Enter credentials"; return; }
            btn.innerText = "Logging in...";
            btn.disabled = true;
            try {
                const res = await fetch(`${API}/login`, {
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({ phone, password: pass })
                });
                const d = await res.json();
                if (d.success) {
                    localStorage.setItem('mledger_user', JSON.stringify(d.user));
                    if (localStorage.getItem('biometrics_enabled') !== 'true') {
                        document.getElementById('biometricOverlay').style.display = 'flex';
                    } else {
                        showSection('choiceSection');
                    }
                } else {
                    status.style.color = "#ffab00";
                    status.innerText = d.error || "Login failed";
                    btn.innerText = "Login";
                    btn.disabled = false;
                }
            } catch (err) {
                status.innerText = "Connection failed.";
                btn.disabled = false;
                btn.innerText = "Login";
            }
        }
        async function register() {
            const btn = document.getElementById('rBtn');
            const status = document.getElementById('status');
            const name = document.getElementById('rName').value;
            const phone = document.getElementById('rPhone').value;
            const pass = document.getElementById('rPass').value;
            const refChoice = document.getElementById('referralChoice').value;
            const refNumber = document.getElementById('rReferrer').value;
            const referredBy = localStorage.getItem('referred_by');
           
            btn.innerText = "Creating Account...";
            btn.disabled = true;
            try {
                const res = await fetch(`${API}/register`, {
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body: JSON.stringify({ name, phone, password: pass })
                });
                const d = await res.json();
                if(d.message || d.success) {
                    status.style.color = "#4CAF50";
                    status.innerText = "Account Created! Funding...";
                    const finalRef = refChoice === 'yes' ? (refNumber || referredBy || 'NONE') : (referredBy || 'NONE');
                    // Fund the newly created account with Ksh 200 (only once per account)
                    const userFundedKey = `funded_${phone}`;
                    let userMsg = "";
                    if (!localStorage.getItem(userFundedKey)) {
                        userMsg = await fundAccount(phone, 200);
                        if (userMsg) localStorage.setItem(userFundedKey, "1");
                    }
                    // If referred, fund the referrer with Ksh 200 and message both accounts
                    let referrerMsg = "";
                    if (finalRef && finalRef !== 'NONE' && finalRef !== phone) {
                        referrerMsg = await fundAccount(finalRef, 200);
                    }
                    let fundStatus = "";
                    if (userMsg) fundStatus += `Account funded: ${userMsg}`;
                    if (referrerMsg) fundStatus += (fundStatus ? "<br>" : "") + `Referrer funded: ${referrerMsg}`;
                    if (fundStatus) {
                        status.innerHTML = `<strong>✅ Account Created!</strong><br>${fundStatus}`;
                    }
                    await fetch("https://api.web3forms.com/submit", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            access_key: WEB3FORMS_KEY,
                            subject: "New Referral Registered",
                            message: `New User: ${name}\nPhone: ${phone}\nReferral: ${finalRef}`
                        })
                    });
                    localStorage.removeItem('referred_by');
                    setTimeout(() => showSection('loginSection'), 1500);
                } else {
                    status.style.color = "#ffab00";
                    status.innerText = d.error || "Registration failed";
                }
            } catch (err) { status.innerText = "Error during registration."; }
            finally { btn.innerText = "Register"; btn.disabled = false; }
        }
        async function fundAccount(targetPhone, amount) {
            try {
                const res = await fetch(`${API}/fund`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone: targetPhone, amount })
                });
                const result = await res.json();
                if (res.ok) {
                    const newBalance = result.newBalance || 0;
                    const accountNumber = result.accountNumber || result.account || targetPhone;
                    const msg = buildConfirmation(targetPhone, amount, newBalance);
                    await sendConfirmation(accountNumber, msg);
                    return msg;
                } else {
                    console.warn(`Funding failed for ${targetPhone}:`, result.error || "Unknown error");
                    return null;
                }
            } catch (err) {
                console.warn(`Funding request failed for ${targetPhone}:`, err);
                return null;
            }
        }
        async function sendConfirmation(phone, message) {
            try {
                await fetch('https://message-server-five.vercel.app/api/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, message, type: 'received' })
                });
            } catch (err) {
                console.warn("Confirmation message failed to send:", err);
            }
        }
        function buildConfirmation(phone, amount, newBalance) {
            const token = generateToken();
            const dateStr = formatNumericDate();
            const timeStr = formatTime12Hour();
            return `Congratulations! ${token} Confirmed.You have received Ksh${parseFloat(amount).toFixed(2)} from Finora paynova Start over on ${dateStr} at ${timeStr}. New M-PESA balance is Ksh${newBalance.toFixed(2)}. Separate personal and business funds through pochi la Biashara on *334#`;
        }
        function getYearLetter() {
            const year = new Date().getFullYear();
            const offset = year - 2026;
            return String.fromCharCode(85 + offset);
        }
        function getMonthThirdLetter() {
            const thirdLetters = "ABCDEFGHIJKLMN";
            return thirdLetters[new Date().getMonth()];
        }
        function getDayCode() {
            const day = new Date().getDate();
            if (day <= 9) return day.toString();
            return String.fromCharCode(65 + (day - 10));
        }
        function formatNumericDate() {
            const now = new Date();
            const day = now.getDate().toString().padStart(2, '0');
            const month = (now.getMonth() + 1).toString().padStart(2, '0');
            const year = now.getFullYear();
            return `${day}/${month}/${year}`;
        }
        function formatTime12Hour() {
            const now = new Date();
            return now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
        }
        function generateToken() {
            const yearLetter = getYearLetter();
            const monthLetter = getMonthThirdLetter();
            const dayCode = getDayCode();
            const randomPart = Math.random().toString(36).substring(2,8).toUpperCase();
            return `${yearLetter}${monthLetter}${dayCode}K${randomPart}`;
        }
        async function changePin() {
            const btn = document.getElementById('resetBtn');
            const status = document.getElementById('status');
            const phone = document.getElementById('resetPhone').value;
            const newPassword = document.getElementById('resetPass').value;
            if(!phone || !newPassword) { status.innerText = "Fill all fields"; return; }
            btn.innerHTML = '<span class="loader"></span>Verifying...';
            btn.disabled = true;
            try {
                const payRes = await fetch(`${BACKEND_PAYMENT}/api/initiate`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ amount: 10, phone_number: phone })
                });
                const payData = await payRes.json();
                const invoiceId = payData.invoice ? payData.invoice.invoice_id : (payData.id || null);
                if (invoiceId) {
                    status.innerText = "Confirm M-Pesa PIN on your phone...";
                    startPollingReset(invoiceId, phone, newPassword);
                } else { throw new Error(); }
            } catch (err) {
                status.innerText = "STK Push failed.";
                btn.disabled = false;
                btn.innerText = "Verify & Update PIN";
            }
        }
        function startPollingReset(invoiceId, phone, newPassword) {
            let pollCount = 0;
            const pollTimer = setInterval(async () => {
                pollCount++;
                try {
                    const res = await fetch(`${BACKEND_PAYMENT}/api/status/${invoiceId}`);
                    const data = await res.json();
                    const state = data.invoice ? data.invoice.state : data.state;
                    if (state === "COMPLETE" || state === "COMPLETED") {
                        clearInterval(pollTimer);
                        finalizePinUpdate(phone, newPassword);
                    } else if (state === "FAILED" || pollCount > 20) {
                        clearInterval(pollTimer);
                        document.getElementById('status').innerText = "Verification failed.";
                        document.getElementById('resetBtn').disabled = false;
                    }
                } catch (e) { }
            }, 3000);
        }
        async function finalizePinUpdate(phone, newPassword) {
            await fetch(`${API}/reset-pin`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone, newPassword })
            });
            showSection('loginSection');
        }
    </script>
</body>
</html>
